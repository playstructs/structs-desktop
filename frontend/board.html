<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Structs — Team Ops</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/structicons.css" />
  <link rel="stylesheet" href="css/sui/sui.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }
    body { margin: 0; background: var(--background, #0d0f15); }
    .height-100 { height: 100%; }
    /* Fill the window with the panel; position:relative anchors the panel's
       absolutely-positioned fill-backgrounds (the game uses #menu-page-layout).
       overflow-x:hidden + border-box guarantee no sideways scrollbar from
       sub-pixel rounding or the panel edge chrome. */
    #board-layout { height: 100%; display: flex; position: relative; overflow-x: hidden; max-width: 100%; }
    #board-layout .sui-panel { flex: 1; min-height: 0; min-width: 0; }
    /* Force the content chain to fill the window's full width. The SUI card
       chain (sui-data-card is align-items:flex-start) leaves children content-
       sized unless each level is told to stretch — so the scroll body, each
       page, and the cards are all pinned to 100% and pages are stretch-flex
       columns so cards span edge-to-edge on a wide window. */
    #board-layout .sui-page-body-screen { width: 100%; align-self: stretch; }
    .ops-scroll { width: 100%; overflow-y: auto; overflow-x: hidden; padding: 14px 18px; }
    .page { width: 100%; }
    .page:not([hidden]) { display: flex; flex-direction: column; align-items: stretch; }
    #board-layout .sui-data-card { width: 100%; align-self: stretch; margin-bottom: 12px; }
    .sui-data-card-body { width: 100%; flex-direction: column; }
    .sui-data-card-row { width: 100%; justify-content: space-between; gap: 16px; }
    .ops-val { font-weight: 600; }
    .ops-list { margin: 4px 0 0; padding-left: 16px; }
    .ops-list li { margin: 4px 0; }
    /* Nav bar: tabs left, refresh control right. Scoped to the board window so
       it can't affect the game's own sui-screen-nav elsewhere. */
    #board-layout .sui-screen-nav { display: flex; align-items: center; justify-content: space-between; }
    #board-layout .sui-screen-nav-items { overflow-x: auto; }
    .board-navaside { display: flex; align-items: center; gap: 6px; flex: none; padding: 0 4px; }
    .board-navaside #board-updated { font-size: 10px; white-space: nowrap; }
    .board-navaside .is-busy { opacity: .4; pointer-events: none; }
    /* The five area tabs need ~394px in the game font. Below that the
       timestamp was stealing 170px and scrolling Command and System out of
       the bar entirely — the nav is not the place to lose. The stamp is
       mirrored into the refresh button's tooltip, so nothing is lost. */
    @media (max-width: 760px) {
      .board-navaside #board-updated { display: none; }
    }
    .ops-refresh { display: flex; align-items: baseline; gap: 10px; padding-right: 16px; font-size: 12px; white-space: nowrap; }
    .ops-refresh-btn { cursor: pointer; text-decoration: underline; text-decoration-style: dotted;
                       color: var(--accent-primary, #6cf); white-space: nowrap; }
    .ops-refresh-btn.is-busy { opacity: .5; pointer-events: none; }
    /* Pages: persistent sibling containers toggled with [hidden] so per-page
       state (feed list, map image, roster selection) survives tab switches. */
    .page[hidden] { display: none; }
    #vp-select { width: 100%; }
    #vp-map img { width: 100%; border: 1px solid var(--border); border-radius: 6px; display: block; }
    .ops-muted { opacity: .7; }
    /* EVENT FEED — newest first, capped height so it never swallows the page. */
    #feed-list { list-style: none; margin: 4px 0 0; padding: 0; max-height: 240px; overflow-y: auto;
                 font-family: monospace; font-size: 12px; width: 100%; }
    #feed-list li { margin: 3px 0; display: flex; gap: 8px; align-items: baseline; }
    .feed-ts { opacity: .55; flex: none; }
    .feed-src { opacity: .75; flex: none; }
    .feed-important { color: var(--text-warning); font-weight: 600; }
    .feed-notice { font-weight: 500; }
    /* Repeat counter: 54 identical auto_harvest lines collapse to one row. */
    .feed-count { flex: none; padding: 0 5px; font-size: 10px; letter-spacing: .5px;
      border: 1px solid var(--accent-secondary); color: var(--accent-secondary); }
    .feed-msg { min-width: 0; overflow-wrap: anywhere; }
    #feed-alerts { list-style: none; margin: 0; padding: 0; width: 100%;
      font-family: monospace; font-size: 12px; }
    #feed-alerts li { margin: 3px 0; display: flex; gap: 8px; align-items: baseline; }
    /* GRASS stream — one generic row style for every message category. */
    #grass-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    #grass-toolbar .sui-input-text { min-width: 110px; }
    #grass-list { list-style: none; margin: 4px 0 0; padding: 0; width: 100%;
                  max-height: calc(100vh - 190px); overflow-y: auto;
                  font-family: monospace; font-size: 12px; }
    #grass-list li { margin: 3px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .grass-badge { flex: none; padding: 0 6px; border: 1px solid; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
    /* A NATS subject carries a full bech32 address, so `flex: none` made the
       row 506px wide in a 441px window and clipped the chips after it. Give
       the subject its own line and let both it and the chips break. */
    .grass-subj { opacity: .7; flex: 1 1 100%; min-width: 0; overflow-wrap: anywhere; }
    .grass-chip { opacity: .9; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .grass-chip b { font-weight: 500; opacity: .65; }
    /* TX queue rows */
    .tx-btns { display: inline-flex; gap: 6px; align-items: center; }
    .tx-btns a { padding: 0 5px; cursor: pointer; }
    .tx-pos { opacity: .55; flex: none; min-width: 18px; text-align: right; }
    /* AGENT UI directives (toasts + prompts) — board-window only. */
    #agent-ui:empty { display: none; }
    .agent-card { border: 1px solid rgba(120,180,255,.45); border-radius: 8px;
                  background: rgba(120,180,255,.08); padding: 10px 12px; margin-bottom: 10px; }
    .agent-card-head { display: flex; align-items: baseline; gap: 8px; }
    .agent-mark { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 8px;
                  background: rgba(120,180,255,.18); color: #9ecbff; flex: none; }
    .agent-title { font-weight: 600; flex: 1; }
    .agent-x { cursor: pointer; opacity: .7; flex: none; padding: 0 4px; }
    .agent-x:hover { opacity: 1; }
    .agent-body { margin: 6px 0 0; font-size: 13px; white-space: pre-wrap; }
    .agent-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .agent-btn { cursor: pointer; border: 1px solid rgba(120,180,255,.55); border-radius: 6px;
                 background: rgba(120,180,255,.14); color: inherit; padding: 4px 14px; font: inherit; }
    .agent-btn:hover { background: rgba(120,180,255,.28); }
    .agent-toast { border-color: rgba(255,180,84,.5); background: rgba(255,180,84,.08); }
    /* ── Native SUI result-rows (raid-scan / roster idiom), laid out as a
       RESPONSIVE GRID so rows flow into 1→N columns as the window widens and
       collapse to one column when narrow — using the full horizontal space
       instead of stranding the right half. Each row keeps its own border
       (bordered "cards" separated by a small gap, which reads cleaner than
       contiguous borders once there are multiple columns). ── */
    #board-layout .sui-result-rows.sui-result-table {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 8px;
      width: 100%;
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      align-content: start;
    }
    /* Roomy like the game's own MEMBER ROSTER row — not the old compressed
       override. Portrait + identity on the left, labeled stats on the right. */
    #board-layout .sui-result-row {
      border: 1px solid var(--border, #345);   /* every cell fully bordered in a grid */
      padding: 9px 12px; gap: 8px 12px; min-width: 0; align-items: center;
      /* WRAP, don't clip. A roster row is a portrait + identity + three stat
         tiles; below about 420px those cannot share a line, and forcing them to
         made the stats overlap the PID instead of moving. Wrapping puts the
         stats on a second line, which stays readable. */
      flex-wrap: wrap;
    }
    #board-layout .sui-result-row-left-section {
      min-width: 0; flex: 1 1 180px; gap: 10px; padding-right: 0; align-items: center; overflow: hidden;
    }
    #board-layout .sui-result-row-right-section {
      min-width: 0; flex: 1 1 auto; gap: 10px; align-items: center; justify-content: flex-end;
    }
    /* Profile portrait — 40px framed avatar; the 5 pfp layers stack absolutely
       and paint back-to-front (crisp pixel art). */
    #board-layout .sui-result-row-portrait,
    #board-layout .sui-result-row-portrait-icon { width: 40px; height: 40px; flex: none; }
    #board-layout .sui-result-row-portrait-image {
      position: relative; width: 40px; height: 40px; overflow: hidden;
      border: 1px solid var(--border-subtle, #2a3a4d); background: #0b1017;
    }
    /* Let the webapp's own .pfp-viewer-layer rule position the 5 layers (a 72px
       layer centered, then cropped by the 40px frame — the native
       head-and-shoulders portrait). Overriding width/left here fights the
       native translateX and shoves the layer off-frame (black gap). We only
       make the pixel art crisp. */
    #board-layout .pfp-viewer-layer { image-rendering: pixelated; }
    #board-layout .sui-result-row-resources { gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
    /* Flex items default to `min-width: auto`, so a long unbroken name
       (auto_retreat_if_cmd_belowhp) pushed the row wider than its card
       instead of wrapping. */
    #board-layout .sui-result-row-left-section,
    #board-layout .sui-result-row-player-info,
    #sui-offcanvas .sui-result-row-left-section,
    #sui-offcanvas .sui-result-row-player-info { min-width: 0; }
    #board-layout .sui-result-row .sui-text-label-block,
    #sui-offcanvas .sui-result-row .sui-text-label-block { overflow-wrap: anywhere; }
    #board-layout .sui-result-row:hover { background: rgba(120,180,255,.07); }
    /* Values must never break mid-unit ("1062 / 1077 kW" stays on one line). */
    .sui-resource { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sui-resource span { white-space: nowrap; }
    /* Labeled stat tile: value over a tiny uppercase caption. */
    .fstat { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .fstat-v { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
      font-variant-numeric: tabular-nums; font-size: 13px; line-height: 1.1; }
    .fstat-v i { flex: none; }
    .fstat-l { font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 1;
      text-transform: uppercase; letter-spacing: .5px; color: var(--text-hint); }
    /* Four severities, all on real SUI tokens: player-teal = good,
       warning-amber = wants a look, enemy-red = wrong, hint = inert. */
    .fstat.ok .fstat-v { color: var(--text-player-primary); }
    /* A tile whose value is a state word rather than a number: `live` marks the
       setting that is actively signing, `muted` an inert one. */
    .fstat.live .fstat-v { color: var(--text-warning); }
    .fstat.muted .fstat-v { color: var(--text-hint); }
    .fstat.bad .fstat-v { color: var(--text-enemy-primary); }
    .fstat-v { justify-content: center; }
    /* Health strip — one row of stat tiles, wrapping on narrow windows. */
    /* Not scoped to #ops-health: System/Diagnostics renders the same tiles,
       and while it was, they fell back to .fstat's centred column there. */
    .hstrip { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-start; }
    .hstrip .fstat { flex: 0 0 auto; align-items: flex-start; }
    .hstrip .fstat-v, .hstrip .fstat-l { justify-content: flex-start; text-align: left; }
    #ops-health .hblocked { margin-top: 10px; }
    /* Row title with an inline glyph — the light alternative to a portrait. */
    .row-title { display: inline-flex; align-items: center; gap: 7px; }
    .row-title i { flex: none; opacity: .8; }
    /* Harvest trio under the PID: icons + values only, quiet by design. */
    .htrio-line { display: inline-flex; gap: 10px; opacity: .75; font-size: 11px; }
    .htrio { white-space: nowrap; }
    .htrio i { font-size: 11px; }
    /* Role Appearance config section */
    .appear-role { display: flex; flex-direction: column; gap: 8px; }
    .appear-preview { display: flex; gap: 8px; margin-bottom: 4px; }
    .appear-preview .sui-result-row-portrait,
    .appear-preview .sui-result-row-portrait-image { width: 48px; height: 48px; }
    .appear-layer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .appear-layer-name { font-size: 12px; min-width: 84px; }
    .appear-layer-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .appear-thumb { position: relative; width: 34px; height: 34px; overflow: hidden; flex: none;
      border: 1px solid var(--border-subtle, #2a3a4d); background: #0b1017; }
    .appear-thumb-btn { cursor: pointer; }
    .appear-thumb-btn:hover { border-color: var(--accent-primary, #6cf); }
    .appear-step { display: inline-flex; padding: 2px 4px; cursor: pointer; opacity: .8; }
    .appear-step:hover { opacity: 1; }
    .appear-idx { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-hint, #6883a0); min-width: 54px; text-align: center; }
    .appear-toggle { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding: 2px 8px;
      border: 1px solid var(--border, #345); cursor: pointer; white-space: nowrap; }
    .appear-toggle.is-random { color: var(--accent-primary, #6cf); border-color: var(--accent-primary, #6cf); }
    .appear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; width: 100%; max-height: 60vh; overflow-y: auto; }
    .appear-grid-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px; border: 1px solid transparent; }
    .appear-grid-cell:hover { border-color: var(--accent-primary, #6cf); }
    .appear-grid-cell.sel { border-color: var(--text-player-primary); }
    .appear-grid-cell .appear-thumb { width: 40px; height: 40px; }
    .appear-grid-n { font-size: 9px; color: var(--text-hint, #6883a0); }
    #board-layout .sui-result-row-player-info,
    #board-layout .sui-text-label-block { min-width: 0; }
    #board-layout .sui-text-label-block { overflow: hidden; text-overflow: ellipsis; }
    /* Row-detail modal (click a roster row) — clean in a grid, unlike a sibling
       band that would split the columns. */
    /* Backdrop shared by the fallback detail panel and the confirm dialog. */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
    .modal-overlay .sui-message-system-modal { max-height: 90%; overflow-y: auto; }
    #detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; z-index: 50; }
    #detail-overlay .detail-panel { background: var(--surface-player-body, #0f1520);
      border: 1px solid var(--border, #345); max-width: 520px; width: 90%;
      max-height: 80%; overflow-y: auto; padding: 14px 16px; }
    #detail-overlay .detail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    #detail-overlay .detail-x { cursor: pointer; opacity: .7; padding: 0 4px; }
    #detail-overlay .detail-x:hover { opacity: 1; }
    /* Toolbars */
    .fbat { display: inline-flex; gap: 2px; align-items: center; }
    .fbat i { width: 5px; height: 10px; background: rgba(120,180,255,.15); display: inline-block; }
    .fbat i.on { background: var(--accent-primary, #6cf); }
    .attn { color: var(--text-warning); }
    .err { color: var(--accent-destructive); }
    /* Mass-action toolbar buttons: keep SUI look, add busy state. */
    .mass-btn.is-busy { opacity: .5; pointer-events: none; }
    /* SUI buttons are a fixed 36px tall, so a wrapping label ("Sweep All
       ~48α" went to three lines) overflows its own frame. Let the button
       grow sideways instead. */
    .mass-btn span { white-space: nowrap; }
    #mass-progress { width: 100%; margin: 6px 0; }
    .bar { height: 8px; background: rgba(120,180,255,.12); border: 1px solid var(--border, #345); width: 80px; }
    .bar > i { display: block; height: 100%; background: var(--accent-primary, #6cf); width: 0; transition: width .3s; }
    /* CONFIG page */
    .cfg-group { margin-bottom: 4px; }
    .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
               padding: 3px 0; font-size: 13px; width: 100%; flex-wrap: wrap; }
    /* (The raw input/select restyling that used to live here is gone — H.field,
       H.stepper, H.selectBox and H.textBox now emit SUI's own markup, so
       sui.css styles them and an override would only fight it.) */
    .cfg-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    /* WAR page: the list cards add free-text id inputs alongside the numeric
       ones, and each result row carries a couple of inline icon actions. */
    .cfg-row .sui-result-row-right-section .cfg-actions,
    .sui-result-row .cfg-actions { margin-top: 0; gap: 4px; }
    .war-addrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    /* Config sub-sections: the same nav component as the board's own tab bar,
       inset so it reads as a level down rather than a second top-level bar. */
    .subnav { margin: 0 0 12px; }
    .subnav .sui-screen-nav { padding: 0 4px; }
    .subnav .sui-screen-nav-items { flex-wrap: wrap; }

    /* ── SUI checkbox, used bare (no text label) ──────────────────────────
       The component is a zero-size <input>, an ABSOLUTELY positioned art
       layer, and a label that reserves 48px for itself. With no label text
       the container collapses to ~0 wide and the art paints straight over
       whatever follows it. Anywhere we use it as a control rather than a
       labelled form field, it has to reserve its own box. */
    #board-layout .sui-checkbox-container,
    #board-layout .sui-radio-container,
    #sui-offcanvas .sui-checkbox-container,
    #sui-offcanvas .sui-radio-container {
      width: var(--form-input-height-total, 32px);
      flex: 0 0 auto;
    }
    #board-layout .sui-checkbox-container label,
    #board-layout .sui-radio-container label,
    #sui-offcanvas .sui-checkbox-container label,
    #sui-offcanvas .sui-radio-container label { margin-left: 0; }
    /* …unless it genuinely carries text, which needs the offset back. */
    #board-layout .sui-checkbox-container.has-label { width: auto; }
    #board-layout .sui-checkbox-container.has-label label { margin-left: 40px; }

    /* Steppers. Two board-specific sizings, both because the game renders SUI
       at transform:scale(2)/(4) (main.css:2338) while this console runs at 1x:
       an 8px inherited font is legible there and not here, and SUI's 25px
       input is sized for a 1-2 digit quantity picker, not a 5-digit interval. */
    #board-layout .sui-input-stepper,
    #sui-offcanvas .sui-input-stepper { gap: 4px; }
    #board-layout .sui-input-stepper input[type="number"],
    #sui-offcanvas .sui-input-stepper input[type="number"] {
      /* Wide enough for the widest real setting (roster_ttl_secs = 21600).
         At SUI's 25px it clipped silently — "300" read as "3" and "21600" as
         "2", which is worse than useless on a settings form.
         `flex: none` is the load-bearing part: the input is a flex child of
         .sui-input-stepper, so a plain width is only a basis and got shrunk
         straight back down. SUI's 16px side padding also has to go, or half
         the field is padding at this size. */
      flex: none; width: 7.2em; min-width: 7.2em;
      padding: var(--spacing-md) 4px;
      font-size: 13px; font-variant-numeric: tabular-nums; text-align: center;
    }
    #board-layout .sui-input-stepper,
    #sui-offcanvas .sui-input-stepper { flex: none; }
    /* The +/- buttons are sui-screen-btn, whose 36px height dwarfs a dense
       settings row; trim to the field height without touching the component. */
    #board-layout .sui-input-stepper .sui-screen-btn,
    #sui-offcanvas .sui-input-stepper .sui-screen-btn {
      height: 24px; min-height: 0; padding: 0 6px; margin: 0;
    }
    #board-layout .sui-input-stepper .sui-screen-btn i,
    #sui-offcanvas .sui-input-stepper .sui-screen-btn i { font-size: 12px; width: 12px; height: 12px; }

    /* ── Config field ────────────────────────────────────────────────────
       H.field builds SUI's own `label.sui-input-text` wrapper, so the label,
       focus ring and input underline all come from sui.css. Two board-side
       adjustments: SUI's 256px min-width is sized for a full page and would
       overflow the 332px offcanvas drawer, and a settings list reads better
       with the control beside its label than under it. ── */
    #board-layout label.sui-input-text.cfg-field,
    #sui-offcanvas label.sui-input-text.cfg-field {
      min-width: 0;
      flex-direction: row; align-items: center; justify-content: space-between;
      gap: 8px 18px; padding: 3px 0;
    }
    /* :first-child — only the caption span, never a control that happens to
       be a span (SUI's own `label.sui-input-text span` rule has this bug). */
    #board-layout label.sui-input-text.cfg-field > span:first-child,
    #sui-offcanvas label.sui-input-text.cfg-field > span:first-child {
      min-height: 0; flex: 1 1 auto; min-width: 0; text-align: left;
    }
    /* Below the drawer width there is no room for two columns — stack. */
    @media (max-width: 420px) {
      #board-layout label.sui-input-text.cfg-field,
      #sui-offcanvas label.sui-input-text.cfg-field { flex-direction: column; align-items: stretch; }
    }

    /* ── listView ────────────────────────────────────────────────────────
       Toolbar / rows / count / pager. The rows grid never scrolls internally:
       it is paginated, so the page scrolls and the pager stays reachable
       instead of a list scrolling inside a scrolling page. ── */
    .listview { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .listview-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .listview-text { min-width: 140px; flex: 1 1 160px; max-width: 320px;
      background: transparent; color: inherit; padding: 4px 8px;
      border: 0 none; border-bottom: 2px solid var(--accent-secondary); }
    .listview-text:focus { outline: none; border-bottom-color: var(--accent-primary-active); }
    .listview-toggle { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .listview-foot { display: flex; justify-content: space-between; align-items: center;
      gap: 12px; font-size: 11px; }
    .listview-pager { display: flex; justify-content: center; }
    #board-layout .sui-result-rows.sui-result-table.list-managed {
      max-height: none; overflow: visible;
    }

    /* A short list (loops, policies) should grow with the card — the internal
       scroll exists for the 180-row Armada roster, and here it just clipped the
       last row under the card footer. */
    #board-layout .sui-result-rows.sui-result-table.list-short {
      max-height: none; overflow: visible;
    }
    /* Rows that open an editor on click get the same affordance as the Armada roster. */
    #board-layout .sui-result-row.is-clickable .row-chevron { opacity: .5; }
    #board-layout .sui-result-row.is-clickable:hover .row-chevron { opacity: 1; }

    /* Long opaque strings (the dashboard URL + its token) must wrap inside the
       card rather than run off the edge of it. */
    /* Drawer body. SUI's page-body chain is `.sui-page-body-screen`(block) >
       `-content`(flex:1 0 0) > `.sui-screen-body`(flex:1 0 0) — and a flex
       basis of 0 inside a BLOCK parent has nothing to stretch against, so both
       collapsed to 32px and the editor's fields were clipped. Let the inner
       boxes size to their content and leave the scrolling to
       `.sui-page-body-screen`, which is already `overflow-y: auto`. */
    #sui-offcanvas .sui-page-body-screen-content {
      flex: none; height: auto; align-items: stretch; text-align: left;
    }
    #sui-offcanvas .sui-offcanvas-body {
      flex: none; height: auto; overflow: visible; text-align: left;
    }
    #sui-offcanvas label.sui-input-text { width: 100%; }
    /* The share URL is one long unbreakable token. `word-break` alone did
       nothing here: as a flex item the anchor keeps `min-width: auto`, so it
       refused to shrink below its min-content width and stretched the whole
       card to 1100px in a 441px window — pushing the enable checkbox off
       screen. `min-width: 0` is the load-bearing declaration. */
    .cfg-url { display: block; min-width: 0; max-width: 100%;
      overflow-wrap: anywhere; word-break: break-all;
      line-height: 1.4; text-align: left; }
    /* Card footnotes are asides, not headlines: quiet, left-aligned, and clear
       of the list they follow. */
    .sui-data-card-body .ops-muted:last-child,
    .cfg-note { font-size: 11px; line-height: 1.45; text-align: left;
      margin-top: 10px; max-width: 62ch; }
  </style>
</head>
<body>
  <div id="board-layout">
    <div class="sui-panel sui-theme-player">
      <div class="sui-panel-top-fill-background"></div>
      <div class="sui-panel-bottom-fill-background"></div>
      <div class="sui-panel-edge-left"></div>
      <div class="sui-panel-chunk sui-mod-grow sui-mod-shrink">
        <div class="sui-screen sui-screen-full-width">
          <div class="sui-screen-nav">
            <!-- Five areas. The sub-nav under this bar is built by the
                 router from the AREAS manifest in board.js — the section is
                 in the hash, so it is linkable and Back works. -->
            <div class="sui-screen-nav-items" id="board-tabs">
              <a class="sui-screen-nav-item sui-mod-active" data-area="command" href="#/command">Command</a>
              <a class="sui-screen-nav-item" data-area="armada" href="#/armada">Armada</a>
              <a class="sui-screen-nav-item" data-area="industry" href="#/industry">Industry</a>
              <a class="sui-screen-nav-item" data-area="war" href="#/war">War</a>
              <a class="sui-screen-nav-item" data-area="system" href="#/system">System</a>
            </div>
            <!-- The right-hand side of the nav bar. Six Board.stamp() calls
                 wrote to #board-updated and the refresh handler bound to
                 #board-refresh — neither element existed until now. -->
            <div class="board-navaside">
              <span id="board-updated" class="sui-text-hint"></span>
              <a id="board-refresh" class="ops-refresh-btn" href="javascript:void(0)"
                 title="Refresh this page now"><i class="icon-refresh-12"></i></a>
            </div>
          </div>
        </div>
        <div class="height-100 sui-screen sui-screen-full-width sui-screen-shrink">
          <div class="height-100 sui-page-body-screen ops-scroll">
            <!-- AGENT UI — toasts + prompts from the policy engine / board
                 directives render HERE, above the router: visible on EVERY tab
                 (never over the main game window). -->
            <div id="agent-ui"></div>

            <!-- Sub-nav for the active area (router-built, empty for areas
                 with a single section). -->
            <div id="board-subnav"></div>

            <!-- ═══ OPS ═══ -->
            <div class="page" id="page-ops">
              <!-- Health strip: is the machine itself alive? Sits ABOVE the
                   game snapshot because a stale snapshot is only readable if
                   you know sync stopped. -->
              <div id="ops-health"></div>
              <!-- Live region: replaced wholesale on each board-update. -->
              <div id="root"><div class="sui-data-card-row">Connecting…</div></div>
              <!-- Persistent region: NOT touched by board-update. -->
              <!-- Anything that wants a human. Hidden until something does. -->
              <div class="sui-data-card sui-theme-player" id="feed-alerts-card" hidden>
                <div class="sui-data-card-header">NEEDS YOU</div>
                <div class="sui-data-card-body sui-mod-spacing-xl">
                  <ul id="feed-alerts"></ul>
                </div>
              </div>
              <div class="sui-data-card sui-theme-player">
                <div class="sui-data-card-header">EVENT FEED</div>
                <div class="sui-data-card-body sui-mod-spacing-xl">
                  <ul id="feed-list"><li class="ops-muted">no events yet</li></ul>
                </div>
              </div>
            </div>

            <!-- ═══ ARMADA (our roster of players — NOT the game fleet entity) ═══ -->
            <div class="page" id="page-armada" hidden>
              <div class="sui-data-card sui-theme-player">
                <div class="sui-data-card-header">ARMADA ROSTER</div>
                <div class="sui-data-card-body sui-mod-spacing-xl" id="armada-body">
                  <div class="sui-message-inline-alert"><i class="sui-icon sui-icon-players sui-icon-sm"></i>
                    <span class="sui-message-inline-alert-text">Roster loading…</span></div>
                </div>
              </div>
            </div>

            <!-- ═══ ENERGY ═══ -->
            <div class="page" id="page-energy" hidden>
              <div id="energy-body">
                <div class="sui-message-inline-alert"><i class="sui-icon sui-icon-energy sui-icon-sm"></i>
                  <span class="sui-message-inline-alert-text">Energy data loading…</span></div>
              </div>
            </div>

            <!-- ═══ WORK ═══ -->
            <div class="page" id="page-work" hidden>
              <div id="work-body">
                <div class="sui-message-inline-alert"><i class="icon-in-progress"></i>
                  <span class="sui-message-inline-alert-text">Work data loading…</span></div>
              </div>
            </div>

            <!-- ═══ TX (signing queue + team results) ═══ -->
            <div class="page" id="page-tx" hidden>
              <div id="tx-body">
                <div class="sui-message-inline-alert"><i class="icon-in-progress"></i>
                  <span class="sui-message-inline-alert-text">Transaction queue loading…</span></div>
              </div>
            </div>

            <!-- ═══ GRASS (live game-event stream) ═══ -->
            <div class="page" id="page-grass" hidden>
              <div id="grass-toolbar"></div>
              <ul id="grass-list" class="ops-feed"></ul>
            </div>

            <!-- ═══ WAR (grudges, target board, incidents, combat settings) ═══ -->
            <div class="page" id="page-war" hidden>
              <div id="war-body">
                <div class="sui-message-inline-alert"><i class="icon-raid"></i>
                  <span class="sui-message-inline-alert-text">Combat data loading…</span></div>
              </div>
            </div>

            <!-- ═══ CONFIG ═══ -->
            <div class="page" id="page-config" hidden>
              <div id="config-body">
                <div class="sui-message-inline-alert"><i class="icon-edit"></i>
                  <span class="sui-message-inline-alert-text">Config loading…</span></div>
              </div>
            </div>

            <!-- ═══ INVENTORY — balances, ledger, transfers ═══ -->
            <div class="page" id="page-inventory" hidden>
              <div id="inventory-body"></div>
            </div>

            <!-- ═══ DIAGNOSTICS — is the machine itself healthy? ═══ -->
            <div class="page" id="page-diagnostics" hidden>
              <div id="diag-body"></div>
            </div>

            <!-- ═══ MAP ═══ -->
            <div class="page" id="page-map" hidden>
              <div class="sui-data-card sui-theme-player">
                <div class="sui-data-card-header">VPLAYER MAP</div>
                <div class="sui-data-card-body sui-mod-spacing-xl">
                  <select id="vp-select" class="sui-input-text">
                    <option value="">— select a planet —</option>
                  </select>
                  <div id="vp-map"></div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
      <div class="sui-panel-edge-right"></div>
    </div>
  </div>
  <!-- Web shim FIRST: fakes __TAURI__ over HTTP/SSE when served as a web page;
       no-ops inside the native Tauri window. -->
  <!-- SUI's own behaviour, loaded as native ES modules straight from the
       webapp's source (sync.sh keeps frontend/sui in lockstep).
       We import individual features rather than SUI.js, whose extensionless
       `import "./SUIOffcanvas"` only resolves under webpack.
       Only the two that suit a fully dynamic page are loaded:
         · SUITooltip  — delegates from document.body, so it picks up
                         [data-sui-tooltip] on content rendered later.
         · SUIOffcanvas — a singleton container we fill on demand.
       SUIInputStepper is deliberately NOT used: it wires each input once at
       init, and every stepper on this board is created after that. H.stepper
       builds the same markup and wires itself. -->
  <script type="module">
    import { SUITooltip } from './sui/SUITooltip.js';
    import { SUIOffcanvas } from './sui/SUIOffcanvas.js';
    var offcanvas = new SUIOffcanvas();
    [new SUITooltip(), offcanvas].forEach(function (f) {
      try { f.autoInitAll(); } catch (e) { console.warn('SUI feature init failed', e); }
    });
    window.SUIRuntime = { offcanvas: offcanvas };
    window.dispatchEvent(new Event('sui-ready'));
  </script>
  <script src="board-shim.js"></script>
  <script src="board.js"></script>
  <script src="board-pages.js"></script>
</body>
</html>
