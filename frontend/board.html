<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Structs — Team Ops</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/structicons.css" />
  <link rel="stylesheet" href="css/sui/sui.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }
    body { margin: 0; background: var(--background, #0d0f15); }
    .height-100 { height: 100%; }
    /* Fill the window with the panel; position:relative anchors the panel's
       absolutely-positioned fill-backgrounds (the game uses #menu-page-layout).
       overflow-x:hidden + border-box guarantee no sideways scrollbar from
       sub-pixel rounding or the panel edge chrome. */
    #board-layout { height: 100%; display: flex; position: relative; overflow-x: hidden; max-width: 100%; }
    #board-layout .sui-panel { flex: 1; min-height: 0; min-width: 0; }
    /* Force the content chain to fill the window's full width. The SUI card
       chain (sui-data-card is align-items:flex-start) leaves children content-
       sized unless each level is told to stretch — so the scroll body, each
       page, and the cards are all pinned to 100% and pages are stretch-flex
       columns so cards span edge-to-edge on a wide window. */
    #board-layout .sui-page-body-screen { width: 100%; align-self: stretch; }
    .ops-scroll { width: 100%; overflow-y: auto; overflow-x: hidden; padding: 14px 18px; }
    .page { width: 100%; }
    .page:not([hidden]) { display: flex; flex-direction: column; align-items: stretch; }
    #board-layout .sui-data-card { width: 100%; align-self: stretch; margin-bottom: 12px; }
    .sui-data-card-body { width: 100%; flex-direction: column; }
    .sui-data-card-row { width: 100%; justify-content: space-between; gap: 16px; }
    .ops-val { font-weight: 600; }
    .ops-list { margin: 4px 0 0; padding-left: 16px; }
    .ops-list li { margin: 4px 0; }
    /* Nav bar: tabs left, refresh control right. Scoped to the board window so
       it can't affect the game's own sui-screen-nav elsewhere. */
    #board-layout .sui-screen-nav { display: flex; align-items: center; justify-content: space-between; }
    #board-layout .sui-screen-nav-items { overflow-x: auto; }
    .ops-refresh { display: flex; align-items: baseline; gap: 10px; padding-right: 16px; font-size: 12px; white-space: nowrap; }
    .ops-refresh-btn { cursor: pointer; text-decoration: underline; text-decoration-style: dotted;
                       color: var(--accent-primary, #6cf); white-space: nowrap; }
    .ops-refresh-btn.is-busy { opacity: .5; pointer-events: none; }
    /* Pages: persistent sibling containers toggled with [hidden] so per-page
       state (feed list, map image, fleet selection) survives tab switches. */
    .page[hidden] { display: none; }
    #vp-select { width: 100%; }
    #vp-map img { width: 100%; border: 1px solid var(--border); border-radius: 6px; display: block; }
    .ops-muted { opacity: .7; }
    /* EVENT FEED — newest first, capped height so it never swallows the page. */
    #feed-list { list-style: none; margin: 4px 0 0; padding: 0; max-height: 240px; overflow-y: auto;
                 font-family: monospace; font-size: 12px; width: 100%; }
    #feed-list li { margin: 3px 0; display: flex; gap: 8px; align-items: baseline; }
    .feed-ts { opacity: .55; flex: none; }
    .feed-src { opacity: .75; flex: none; }
    .feed-important { color: #ffb454; font-weight: 600; }
    .feed-notice { font-weight: 500; }
    /* AGENT UI directives (toasts + prompts) — board-window only. */
    #agent-ui:empty { display: none; }
    .agent-card { border: 1px solid rgba(120,180,255,.45); border-radius: 8px;
                  background: rgba(120,180,255,.08); padding: 10px 12px; margin-bottom: 10px; }
    .agent-card-head { display: flex; align-items: baseline; gap: 8px; }
    .agent-mark { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 8px;
                  background: rgba(120,180,255,.18); color: #9ecbff; flex: none; }
    .agent-title { font-weight: 600; flex: 1; }
    .agent-x { cursor: pointer; opacity: .7; flex: none; padding: 0 4px; }
    .agent-x:hover { opacity: 1; }
    .agent-body { margin: 6px 0 0; font-size: 13px; white-space: pre-wrap; }
    .agent-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .agent-btn { cursor: pointer; border: 1px solid rgba(120,180,255,.55); border-radius: 6px;
                 background: rgba(120,180,255,.14); color: inherit; padding: 4px 14px; font: inherit; }
    .agent-btn:hover { background: rgba(120,180,255,.28); }
    .agent-toast { border-color: rgba(255,180,84,.5); background: rgba(255,180,84,.08); }
    /* ── Native SUI result-rows (raid-scan / roster idiom), laid out as a
       RESPONSIVE GRID so rows flow into 1→N columns as the window widens and
       collapse to one column when narrow — using the full horizontal space
       instead of stranding the right half. Each row keeps its own border
       (bordered "cards" separated by a small gap, which reads cleaner than
       contiguous borders once there are multiple columns). ── */
    #board-layout .sui-result-rows.sui-result-table {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 6px;
      width: 100%;
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      align-content: start;
    }
    #board-layout .sui-result-row {
      border: 1px solid var(--border, #345);   /* every cell fully bordered in a grid */
      padding: 5px 8px; gap: 8px 16px; font-size: 12px; min-width: 0;
    }
    #board-layout .sui-result-row-left-section { min-width: 0; flex: 1 1 auto; gap: 8px; padding-right: 8px; }
    #board-layout .sui-result-row-right-section { min-width: 0; flex: 0 1 auto; }
    #board-layout .sui-result-row-portrait,
    #board-layout .sui-result-row-portrait-icon { width: 24px; height: 24px; flex: none; }
    #board-layout .sui-result-row-resources { gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    #board-layout .sui-result-row:hover { background: rgba(120,180,255,.07); }
    /* Values must never break mid-unit ("1062 / 1077 kW" stays on one line). */
    .sui-resource { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sui-resource span { white-space: nowrap; }
    #board-layout .sui-result-row-player-info,
    #board-layout .sui-text-label-block { min-width: 0; }
    #board-layout .sui-text-label-block { overflow: hidden; text-overflow: ellipsis; }
    /* Row-detail modal (click a fleet row) — clean in a grid, unlike a sibling
       band that would split the columns. */
    #detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; z-index: 50; }
    #detail-overlay .detail-panel { background: var(--surface-player-body, #0f1520);
      border: 1px solid var(--border, #345); max-width: 520px; width: 90%;
      max-height: 80%; overflow-y: auto; padding: 14px 16px; }
    #detail-overlay .detail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    #detail-overlay .detail-x { cursor: pointer; opacity: .7; padding: 0 4px; }
    #detail-overlay .detail-x:hover { opacity: 1; }
    /* Toolbars */
    #fleet-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    #fleet-toolbar .sui-input-text { flex: 1; min-width: 120px; }
    .fleet-foot { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; }
    .fbat { display: inline-flex; gap: 2px; align-items: center; }
    .fbat i { width: 5px; height: 10px; background: rgba(120,180,255,.15); display: inline-block; }
    .fbat i.on { background: var(--accent-primary, #6cf); }
    .attn { color: #ffb454; }
    .err { color: #ff6b6b; }
    /* Mass-action toolbar buttons: keep SUI look, add busy state. */
    .mass-btn.is-busy { opacity: .5; pointer-events: none; }
    #mass-progress { width: 100%; margin: 6px 0; }
    .bar { height: 8px; background: rgba(120,180,255,.12); border: 1px solid var(--border, #345); width: 80px; }
    .bar > i { display: block; height: 100%; background: var(--accent-primary, #6cf); width: 0; transition: width .3s; }
    /* CONFIG page */
    .cfg-group { margin-bottom: 4px; }
    .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
               padding: 3px 0; font-size: 13px; width: 100%; }
    .cfg-row input[type="number"] { width: 80px; background: transparent; color: inherit;
               border: 1px solid var(--border, #345); padding: 2px 6px; }
    .cfg-row select { background: transparent; color: inherit; border: 1px solid var(--border, #345); padding: 2px 6px; }
    .cfg-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="board-layout">
    <div class="sui-panel sui-theme-player">
      <div class="sui-panel-top-fill-background"></div>
      <div class="sui-panel-bottom-fill-background"></div>
      <div class="sui-panel-edge-left"></div>
      <div class="sui-panel-chunk sui-mod-grow sui-mod-shrink">
        <div class="sui-screen sui-screen-full-width">
          <div class="sui-screen-nav">
            <div class="sui-screen-nav-items" id="board-tabs">
              <a class="sui-screen-nav-item sui-mod-active" data-page="ops" href="#/ops">Ops</a>
              <a class="sui-screen-nav-item" data-page="fleet" href="#/fleet">Fleet</a>
              <a class="sui-screen-nav-item" data-page="energy" href="#/energy">Energy</a>
              <a class="sui-screen-nav-item" data-page="work" href="#/work">Work</a>
              <a class="sui-screen-nav-item" data-page="config" href="#/config">Config</a>
              <a class="sui-screen-nav-item" data-page="map" href="#/map">Map</a>
            </div>
            <div class="ops-refresh">
              <span id="board-updated" class="ops-muted"></span>
              <a id="board-refresh" class="ops-refresh-btn" href="javascript:void(0)"
                 title="Refresh the current page now (pages also auto-refresh while this window is focused)">Refresh</a>
            </div>
          </div>
        </div>
        <div class="height-100 sui-screen sui-screen-full-width sui-screen-shrink">
          <div class="height-100 sui-page-body-screen ops-scroll">
            <!-- AGENT UI — toasts + prompts from the policy engine / board
                 directives render HERE, above the router: visible on EVERY tab
                 (never over the main game window). -->
            <div id="agent-ui"></div>

            <!-- ═══ OPS ═══ -->
            <div class="page" id="page-ops">
              <!-- Live region: replaced wholesale on each board-update. -->
              <div id="root"><div class="sui-data-card-row">Connecting…</div></div>
              <!-- Persistent region: NOT touched by board-update. -->
              <div class="sui-data-card sui-theme-player">
                <div class="sui-data-card-header">EVENT FEED</div>
                <div class="sui-data-card-body sui-mod-spacing-xl">
                  <ul id="feed-list"><li class="ops-muted">no events yet</li></ul>
                </div>
              </div>
            </div>

            <!-- ═══ FLEET ═══ -->
            <div class="page" id="page-fleet" hidden>
              <div class="sui-data-card sui-theme-player">
                <div class="sui-data-card-header">FLEET ROSTER</div>
                <div class="sui-data-card-body sui-mod-spacing-xl" id="fleet-body">
                  <div class="sui-message-inline-alert"><i class="sui-icon sui-icon-players sui-icon-sm"></i>
                    <span class="sui-message-inline-alert-text">Roster loading…</span></div>
                </div>
              </div>
            </div>

            <!-- ═══ ENERGY ═══ -->
            <div class="page" id="page-energy" hidden>
              <div id="energy-body">
                <div class="sui-message-inline-alert"><i class="sui-icon sui-icon-energy sui-icon-sm"></i>
                  <span class="sui-message-inline-alert-text">Energy data loading…</span></div>
              </div>
            </div>

            <!-- ═══ WORK ═══ -->
            <div class="page" id="page-work" hidden>
              <div id="work-body">
                <div class="sui-message-inline-alert"><i class="icon-in-progress"></i>
                  <span class="sui-message-inline-alert-text">Work data loading…</span></div>
              </div>
            </div>

            <!-- ═══ CONFIG ═══ -->
            <div class="page" id="page-config" hidden>
              <div id="config-body">
                <div class="sui-message-inline-alert"><i class="icon-edit"></i>
                  <span class="sui-message-inline-alert-text">Config loading…</span></div>
              </div>
            </div>

            <!-- ═══ MAP ═══ -->
            <div class="page" id="page-map" hidden>
              <div class="sui-data-card sui-theme-player">
                <div class="sui-data-card-header">VPLAYER MAP</div>
                <div class="sui-data-card-body sui-mod-spacing-xl">
                  <select id="vp-select" class="sui-input-text">
                    <option value="">— select a planet —</option>
                  </select>
                  <div id="vp-map"></div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
      <div class="sui-panel-edge-right"></div>
    </div>
  </div>
  <script src="board.js"></script>
  <script src="board-pages.js"></script>
</body>
</html>
