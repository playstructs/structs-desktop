<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Structs — Team Ops</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/structicons.css" />
  <link rel="stylesheet" href="css/sui/sui.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }
    body { margin: 0; background: var(--background, #0d0f15); }
    .height-100 { height: 100%; }
    /* Fill the window with the panel; position:relative anchors the panel's
       absolutely-positioned fill-backgrounds (the game uses #menu-page-layout).
       overflow-x:hidden + border-box guarantee no sideways scrollbar from
       sub-pixel rounding or the panel edge chrome. */
    #board-layout { height: 100%; display: flex; position: relative; overflow-x: hidden; max-width: 100%; }
    #board-layout .sui-panel { flex: 1; min-height: 0; min-width: 0; }
    .ops-scroll { overflow-y: auto; overflow-x: hidden; padding: 14px 18px; }
    .sui-data-card { width: 100%; margin-bottom: 12px; }
    .sui-data-card-body { width: 100%; flex-direction: column; }
    .sui-data-card-row { width: 100%; justify-content: space-between; gap: 16px; }
    .ops-val { font-weight: 600; }
    .ops-list { margin: 4px 0 0; padding-left: 16px; }
    .ops-list li { margin: 4px 0; }
    #vp-select { width: 100%; }
    #vp-map img { width: 100%; border: 1px solid var(--border); border-radius: 6px; display: block; }
    .ops-muted { opacity: .7; }
    /* EVENT FEED — newest first, capped height so it never swallows the page. */
    #feed-list { list-style: none; margin: 4px 0 0; padding: 0; max-height: 240px; overflow-y: auto;
                 font-family: monospace; font-size: 12px; width: 100%; }
    #feed-list li { margin: 3px 0; display: flex; gap: 8px; align-items: baseline; }
    .feed-ts { opacity: .55; flex: none; }
    .feed-src { opacity: .75; flex: none; }
    .feed-important { color: #ffb454; font-weight: 600; }
    .feed-notice { font-weight: 500; }
  </style>
</head>
<body>
  <div id="board-layout">
    <div class="sui-panel sui-theme-player">
      <div class="sui-panel-top-fill-background"></div>
      <div class="sui-panel-bottom-fill-background"></div>
      <div class="sui-panel-edge-left"></div>
      <div class="sui-panel-chunk sui-mod-grow sui-mod-shrink">
        <div class="sui-screen sui-screen-full-width">
          <div class="sui-screen-nav">
            <div class="sui-screen-nav-items">
              <a class="sui-screen-nav-item sui-mod-active" href="javascript:void(0)">Team Ops</a>
            </div>
          </div>
        </div>
        <div class="height-100 sui-screen sui-screen-full-width sui-screen-shrink">
          <div class="height-100 sui-page-body-screen ops-scroll">
            <!-- Live region: replaced wholesale on each board-update. -->
            <div id="root"><div class="sui-data-card-row">Connecting…</div></div>
            <!-- Persistent region: NOT touched by board-update. -->
            <div class="sui-data-card sui-theme-player">
              <div class="sui-data-card-header">EVENT FEED</div>
              <div class="sui-data-card-body sui-mod-spacing-xl">
                <ul id="feed-list"><li class="ops-muted">no events yet</li></ul>
              </div>
            </div>
            <div class="sui-data-card sui-theme-player">
              <div class="sui-data-card-header">VPLAYER MAP</div>
              <div class="sui-data-card-body sui-mod-spacing-xl">
                <select id="vp-select" class="sui-input-text">
                  <option value="">— select a planet —</option>
                </select>
                <div id="vp-map"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="sui-panel-edge-right"></div>
    </div>
  </div>
  <script>
    (function boot() {
      var T = window.__TAURI__;
      if (!T || !T.event || !T.core) { setTimeout(boot, 150); return; }
      var root = document.getElementById('root');
      function render(html) { if (typeof html === 'string') root.innerHTML = html; }
      T.core.invoke('mcp_board_html').then(render).catch(function () {});
      T.event.listen('board-update', function (e) {
        render(e && e.payload && e.payload.html);
      });

      // EVENT FEED — back-fill from the ring buffer, then append live entries.
      var feed = document.getElementById('feed-list');
      var FEED_MAX_ROWS = 150;
      function feedRow(e) {
        var li = document.createElement('li');
        if (e.severity === 'important') li.className = 'feed-important';
        else if (e.severity === 'notice') li.className = 'feed-notice';
        var ts = document.createElement('span');
        ts.className = 'feed-ts';
        ts.textContent = new Date(e.ts_ms).toLocaleTimeString();
        var src = document.createElement('span');
        src.className = 'feed-src';
        src.textContent = '[' + e.source + ']';
        var msg = document.createElement('span');
        msg.textContent = e.message;
        li.appendChild(ts); li.appendChild(src); li.appendChild(msg);
        return li;
      }
      function feedAdd(e) {
        if (!e || !e.message) return;
        if (feed.firstChild && feed.firstChild.className === 'ops-muted') feed.innerHTML = '';
        feed.insertBefore(feedRow(e), feed.firstChild); // newest first
        while (feed.children.length > FEED_MAX_ROWS) feed.removeChild(feed.lastChild);
      }
      T.core.invoke('mcp_board_feed').then(function (entries) {
        (entries || []).forEach(feedAdd); // oldest→newest, so newest ends on top
      }).catch(function () {});
      T.event.listen('board-feed', function (e) { feedAdd(e && e.payload); });

      // VPLAYER MAP dropdown — populate once; render the chosen player's map.
      var sel = document.getElementById('vp-select');
      var box = document.getElementById('vp-map');
      T.core.invoke('mcp_vplayer_list').then(function (list) {
        (list || []).forEach(function (p) {
          if (!p.player_id) return;
          var o = document.createElement('option');
          o.value = p.player_id;
          o.textContent = p.name + ' (' + p.player_id + ')';
          sel.appendChild(o);
        });
      }).catch(function () {});
      sel.addEventListener('change', function () {
        var v = sel.value;
        if (!v) { box.innerHTML = ''; return; }
        box.innerHTML = '<div class="ops-muted">rendering map…</div>';
        T.core.invoke('mcp_render_map', { player: v }).then(function (durl) {
          var img = new Image();
          img.alt = 'map';
          img.onload = function () { box.innerHTML = ''; box.appendChild(img); };
          img.onerror = function () { box.innerHTML = '<div style="color:#ff6b6b">image failed to load</div>'; };
          img.src = durl;
        }).catch(function (err) {
          box.innerHTML = '<div style="color:#ff6b6b">render failed: ' + err + '</div>';
        });
      });
    })();
  </script>
</body>
</html>
