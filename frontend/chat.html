<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Structs — Comms</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/structicons.css" />
  <link rel="stylesheet" href="css/sui/sui.css" />
  <!-- The GAME's own stylesheet. Loaded on purpose, and the ids below are the
       game's own menu-page ids on purpose: main.css frames #menu-page-layout
       and drives its integer pixel-art scaling (scale(2) at >=1152px,
       scale(4) at >=2304px, with the matching 50vw/25vw box). Reusing the ids
       is how this window gets the SAME chrome and the SAME scaling as the
       in-game menu without re-deriving either.

       Unlike raidview.html there is no map here, so nothing competes with
       that scaler. This document loads no game bundle — it shares an origin
       with the game (tauri://localhost), so booting index.html here would
       share the localStorage holding the mnemonic. Nothing below can sign,
       mine, or broadcast; every write goes through a Rust command. -->
  <link rel="stylesheet" href="css/main.css" />
  <!-- The chat message row, shared with the other window that draws one. -->
  <link rel="stylesheet" href="chat-rows.css" />
  <style>
    /* ── Comms ────────────────────────────────────────────────────────────
       Composition only. Every colour, font and spacing value below is a SUI
       token or a SUI class — no invented palette, no emoji-as-icon. The
       classes that do the visual work (.sui-panel, .sui-screen,
       .sui-result-row, .sui-page-header, .sui-badge, .sui-input-text) come
       from the shipped webapp; these rules only place them. */

    *, *::before, *::after { box-sizing: border-box; }
    /* ...except the handful of SUI components sized to a FIXED content width.
       `.sui-screen-battery` is `width: 36px` with a 2px themed border: five
       4px chunks and four 4px gaps fit that content box EXACTLY. Under a
       border-box reset the content is 32px, the chunks flex-shrink to
       3.203125px, and pixel art at a fractional width is mush — which is what
       "the charge bars are wonky, the real map looks cleaner" was. The game
       has no reset at all (normalize.css scopes box-sizing to `legend` and the
       radio/checkbox inputs), so these are restored to the box model they were
       drawn in.

       NAMED, not `[class^="sui-"]`. Exempting every SUI class was the first
       attempt and it broke the window: components sized `width: 100%` then
       added their padding and border OUTSIDE that 100% and overflowed their
       parent by exactly that much — `.sui-data-card-body` by 34px,
       `.sui-page-body-screen` by 20px — so `#board-layout` clipped 26px off
       the right of every page. Only fixed-px components belong here. */
    .sui-screen-battery,
    .sui-screen-properties,
    .sui-result-row-portrait,
    .sui-result-row-portrait-image { box-sizing: content-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--page-background);
      color: var(--text-body);
      font-family: 'DirectiveZero', sans-serif;
    }
    .hidden { display: none !important; }

    /* ── Tabs ──────────────────────────────────────────────────────────────
       The conversations you have open, in the slot the game uses for its menu
       sections. `.sui-screen-nav-item` already supplies the type, the case and
       the active underline; these rules only add the close affordance and stop
       a long room name from pushing the strip apart. */
    .chat-tab { max-width: 140px; }
    .chat-tab-label {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0;
    }
    /* A dot, not a count — the strip is for switching, and the number is
       already on the row in the channel list. */
    .chat-tab-dot {
      flex: 0 0 auto; width: 4px; height: 4px;
      background: var(--accent-primary);
    }
    .chat-tab-dot.chat-mod-mention { background: var(--text-warning); }
    /* Quiet until wanted: an × on every tab, always lit, turns the strip into
       a row of buttons rather than a row of places. */
    .chat-tab-close {
      flex: 0 0 auto; display: inline-flex; align-items: center;
      opacity: .35;
    }
    .chat-tab-close:hover { opacity: 1; color: var(--text-enemy-primary); }
    .chat-tab.sui-mod-active .chat-tab-close { opacity: .6; }

    /* The nav's right-hand cluster: page icons + window close. Sits where
       #menu-page-nav-close sits in the game, so the bar keeps its silhouette. */
    #chat-nav-actions {
      display: flex; align-items: stretch; align-self: stretch; gap: 0;
    }
    #chat-nav-actions a {
      display: flex; align-items: center;
      padding: var(--spacing-sm) var(--spacing-md);
      text-decoration: none; color: var(--accent-primary);
    }
    #chat-nav-actions a.sui-mod-active { border-bottom: 2px solid var(--accent-primary-active); }
    #chat-nav-actions a:hover { color: var(--accent-primary-active); }

    /* A page fills the body content box and scrolls in its middle band only,
       so the header and the composer stay put. */
    .chat-page {
      display: flex; flex-direction: column;
      width: 100%; height: 100%; min-height: 0;
    }

    /* Section chip ("LOCAL NET" / "GALAXY NET"). The filled variant of
       .sui-text-label — same font and case, inverted onto the accent. */
    .chat-net-label {
      align-self: flex-start;
      padding: var(--spacing-xs) var(--spacing-sm);
      background: var(--accent-primary);
      color: var(--text-player-inverted);
      font-family: 'ExtremeHazard', sans-serif;
      font-size: 8px; line-height: 16px; text-transform: uppercase;
    }
    .chat-net-group { display: flex; flex-direction: column; gap: var(--spacing-xs); }

    /* Rows are .sui-result-row; only the icon well needs placing, because the
       roster's portrait well expects a rendered PFP rather than a glyph. */
    .sui-result-row.chat-room-row { cursor: pointer; }
    /* A subtitle is a subtitle: two lines at most, then it ellipsises. A long
       topic must not make one row as tall as three. */
    .sui-result-row .sui-text-hint {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .chat-room-icon {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; flex: 0 0 32px;
    }
    /* The roster's right section is space-between because it carries a row of
       resource chips AND a trailing button. These rows carry only an unread
       badge and a Join button, so the default leaves them stranded at the
       start of a 224px-min box instead of against the row's right edge. */
    .chat-page .sui-result-row-right-section {
      justify-content: flex-end;
      gap: var(--spacing-md);
    }
    .chat-room-unread { flex: 0 0 auto; }

    /* Header right-hand cluster: the new-message door beside the resources. */
    .chat-header-actions { display: flex; align-items: center; gap: var(--spacing-md); }

    /* People picker search band — outside .chat-scroll so it stays put. */
    #chat-people-search { flex: 0 0 auto; padding: var(--spacing-sm) var(--spacing-md); }
    #chat-people-search label.sui-input-text { width: 100%; }
    #chat-people-search input[type=text] { width: 100%; }



    /* "Ada is typing…" — the line that says an answer is already coming. */
    .chat-typing {
      flex: 0 0 auto; min-height: 16px;
      padding: 0 var(--spacing-md);
      color: var(--text-hint);
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      text-transform: uppercase; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* An object id inside a message: marked, not decorated. The card below
       carries the detail; this only says "this is a thing the game knows". */
    .chat-id {
      color: var(--text-player-primary);
      border-bottom: 1px dotted var(--text-player-primary);
    }
    /* A link in a message. Opens in the system browser; the tooltip carries
       the real destination, because the visible text is a stranger's. */
    .chat-link {
      color: var(--accent-secondary);
      text-decoration: underline;
      word-break: break-all; cursor: pointer;
    }
    .chat-link:hover { color: var(--accent-secondary-active); }
    .chat-link.chat-mod-refused { color: var(--text-enemy-primary); }

    /* A reference past the first is closed; the chip opens it. */
    .chat-id.chat-mod-openable { cursor: pointer; }
    .chat-id.chat-mod-openable:hover { color: var(--text-player-highlight); }

    /* ── Reference cards ──────────────────────────────────────────────────
       A summary of an object someone named. Design rules, in order of how
       much they matter:

       1. ONE frame. The card used to nest a bordered header, a bordered fact
          table and bordered buttons inside a bordered card — four rectangles
          arguing about one small summary. Now a single surface.
       2. A coloured LEFT EDGE instead of a chip or a badge. It says "this is
          an embed" and says which KIND at a glance, costs no vertical space,
          and is the same idiom a quote or an attachment uses everywhere else.
       3. Hierarchy by weight, not by boxes: title bright, labels dim, values
          bright, actions quiet.
       4. Everything on one left margin, so the eye has a single edge to run
          down. */
    .chat-refs {
      display: flex; flex-direction: column; gap: var(--spacing-sm);
      margin-top: var(--spacing-sm);
      /* An aside, never the width of the conversation. */
      max-width: 340px;
    }
    .chat-ref {
      border: 1px solid var(--border-subtle);
      border-left: 2px solid var(--accent-primary);
      background: var(--surface-player-body);
      text-align: left;
    }

    /* The kind, as colour — on the edge AND on the glyph, so the two agree and
       the type is legible from either. Each hue is an existing token; none is
       invented for this. */
    .chat-ref.chat-kind-player { border-left-color: var(--accent-secondary); }
    .chat-ref.chat-kind-player .chat-ref-glyph { color: var(--accent-secondary); }
    .chat-ref.chat-kind-planet { border-left-color: var(--text-player-primary); }
    .chat-ref.chat-kind-planet .chat-ref-glyph { color: var(--text-player-primary); }
    .chat-ref.chat-kind-struct { border-left-color: var(--text-warning); }
    .chat-ref.chat-kind-struct .chat-ref-glyph { color: var(--text-warning); }
    .chat-ref.chat-kind-fleet { border-left-color: var(--accent-primary); }
    .chat-ref.chat-kind-fleet .chat-ref-glyph { color: var(--accent-primary); }
    .chat-ref.chat-kind-provider { border-left-color: var(--text-neutral-primary); }
    .chat-ref.chat-kind-provider .chat-ref-glyph { color: var(--text-neutral-primary); }
    .chat-ref.chat-kind-guild { border-left-color: var(--accent-primary); }
    .chat-ref.chat-kind-guild .chat-ref-glyph { color: var(--accent-primary); }
    .chat-ref.chat-kind-substation { border-left-color: var(--accent-disabled); }
    .chat-ref.chat-kind-substation .chat-ref-glyph { color: var(--accent-disabled); }

    .chat-ref-head {
      display: flex; align-items: center; gap: var(--spacing-sm);
      padding: var(--spacing-sm);
    }
    /* 44px is the portrait's OWN size — the art is a fixed crop of fixed
       layers and shrinking the frame clips the clip. */
    .chat-ref-portrait { flex: 0 0 44px; }
    .chat-ref-portrait .pfp-viewer-layer { image-rendering: pixelated; }
    .chat-ref-glyph {
      flex: 0 0 24px; display: flex; align-items: center; justify-content: center;
      color: var(--text-hint);
    }
    .chat-ref-names { min-width: 0; }
    .chat-ref-title {
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      text-transform: uppercase; color: var(--text-body);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-ref-sub {
      color: var(--text-hint);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Facts: a two-column grid, so labels and values align down the card with
       no table borders to draw them. */
    .chat-ref-facts {
      display: grid; grid-template-columns: auto 1fr;
      /* A little air between rows: at 16px line-height four facts read as a
         solid block rather than as four separate readings. */
      gap: var(--spacing-xs) var(--spacing-md);
      padding: 0 var(--spacing-sm) var(--spacing-sm);
      line-height: 18px;
    }
    .chat-ref-label { color: var(--text-hint); white-space: nowrap; }
    .chat-ref-value {
      color: var(--text-body); text-align: right;
      word-break: normal; overflow-wrap: anywhere;
    }

    /* Actions are affordances, not content: quiet until hovered, and on one
       line. Full-size screen buttons wrapped onto two rows and outweighed the
       summary they belonged to. */
    .chat-ref-actions {
      /* Wraps. A card's action count is not fixed — a player with a planet, a
         fleet, a DM and a payment already fills the row at chat widths, and a
         nowrap row does not overflow visibly: it squeezes the LAST button
         until its label breaks over two lines and outgrows its neighbours. */
      display: flex; flex-wrap: wrap; gap: var(--spacing-xs);
      padding: 0 var(--spacing-sm) var(--spacing-sm);
    }
    .chat-ref-action {
      display: inline-flex; align-items: center; gap: var(--spacing-xs);
      /* A label belongs on one line; the ROW wraps instead of the words. */
      white-space: nowrap; flex: 0 0 auto;
      padding: var(--spacing-xs) var(--spacing-sm);
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-hint);
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      text-transform: uppercase; cursor: pointer;
    }
    .chat-ref-action:hover {
      border-color: var(--accent-primary);
      color: var(--text-player-primary);
    }
    .chat-ref-action:disabled { opacity: .4; cursor: default; }

    .chat-ref-portrait.chat-mod-clickable { cursor: pointer; }
    .chat-ref-portrait.chat-mod-clickable:hover { outline: 1px solid var(--accent-primary); }

    /* A card's own outcome line — in place, because the card is where the
       action was taken. */
    .chat-ref-note {
      padding: 0 var(--spacing-sm) var(--spacing-sm);
      color: var(--text-player-primary);
    }
    .chat-ref-note.chat-mod-error { color: var(--text-enemy-primary); }

    /* Renting capacity: two numbers and the price they come to. */
    .chat-rent {
      display: flex; flex-direction: column; gap: var(--spacing-sm);
      padding: var(--spacing-sm);
      border-top: 1px solid var(--border-subtle);
    }
    .chat-rent-field label.sui-input-text { width: 100%; }
    .chat-rent-field input { width: 100%; }
    /* The number about to be spent, stated before the button that spends it. */
    .chat-rent-quote {
      color: var(--text-warning); text-align: left;
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      text-transform: uppercase;
    }
    .chat-rent .chat-ref-actions { padding: 0; }

    /* A labelled hairline: day separators, and the unread divider. */
    .chat-rule {
      display: flex; align-items: center; gap: var(--spacing-sm);
      padding-left: calc(var(--spacing-sm) + 2px);
    }
    .chat-rule-line { flex: 1 1 auto; height: 1px; background: var(--border-subtle); }
    .chat-rule-label {
      flex: 0 0 auto; color: var(--text-hint);
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      text-transform: uppercase;
    }
    .chat-rule.chat-mod-alert .chat-rule-line { background: var(--text-warning); }
    .chat-rule.chat-mod-alert .chat-rule-label { color: var(--text-warning); }

    /* ── Composer ─────────────────────────────────────────────────────────
       The action bar's own art does all the drawing (.sui-panel edges,
       chunks, connectors, .sui-panel-btn). These rules only place it at the
       foot of the page and let the middle chunk take the slack — everything
       visible is the game's. */
    /* Full-bleed: the action bar is the bottom edge of the panel, exactly as
       it is in the game's HUD, so it runs to the frame with nothing between. */
    /* `.sui-panel-chunk` lays its children out with `align-items: flex-start`,
       so the host has to opt into full width; and
       `.sui-panel-wrapper-fit-content` is `display: inline-block`, which sizes
       the bar to its own contents. Both have to be overridden or the action
       bar stops short of the frame on the right. */
    #chat-composer-host { flex: 0 0 auto; align-self: stretch; width: 100%; }
    #chat-composer-host:empty { display: none; }
    #chat-composer { display: block; width: 100%; padding: 0; }
    #chat-composer .sui-panel { width: 100%; }
    #chat-composer .sui-panel { width: 100%; }
    /* The panel's chunks size to content; the message field is the one that
       should absorb the width. */
    #chat-composer .sui-panel-chunk.sui-mod-grow { min-width: 0; }
    #chat-composer .sui-screen-dialogue { display: flex; align-items: center; }
    /* The screen IS the input's frame, so the input contributes none of its
       own: no border, no background, no focus ring fighting the panel art. */
    #chat-composer input[type=text] {
      width: 100%; min-width: 0;
      border: none; outline: none; background: transparent;
      color: var(--text-body);
      font-family: 'DirectiveZero', sans-serif; font-size: inherit;
      padding: var(--spacing-sm);
    }
    /* A placeholder should read as an invitation, not as content. SUI's own
       is `--text-hint` (#A7C0C6) against `--text-body` (#C5D7D9) — barely a
       shade apart, so "Message, or /help" looked like something already
       typed. Same hue, just receding: no new colour, only less of it.

       Every text input in this window, not a list of ids. The list version
       named three and was already wrong twice: the channel filter and the
       message search were both added later and neither was added here, so
       each shipped with a placeholder brighter than the text it invites. */
    input::placeholder {
      color: var(--text-hint);
      opacity: 0.45;
    }
    #chat-composer .pfp-viewer-layer { image-rendering: pixelated; }

    /* The bar is taller than any one control in it, and the chunks stack their
       contents from the top — so the portrait and the send button both hung
       from the top of a 70px bar with dead space beneath them. In the game's
       own action bars the panel is exactly as tall as its contents, so the
       question never arises; here the message field sets the height and
       everything else has to meet it in the middle.

       `justify-content`, not `align-items`: a `.sui-panel-chunk` is a COLUMN
       flex container, so its main axis is the vertical one. `align-items` (and
       `align-self` on the children) is the horizontal axis here, and setting
       it changed nothing at all — twice — before the direction was checked. */
    #chat-composer .sui-panel-chunk { justify-content: center; }

    /* The portrait well is 40px by default, against a 48px send button — the
       two flanking controls read as different weights. Matching them makes
       the bar symmetrical, and gives the art the few extra pixels it wants:
       the layers are 72px and cropped, so a bigger well is more of the same
       picture rather than an enlargement of it. */
    #chat-composer .sui-screen-portrait,
    #chat-composer .sui-screen-portrait-image { width: 48px; height: 48px; }

    /* SUI hides the portrait on hover to reveal an action icon underneath —
       right for the HUD, where the portrait is a button that opens a menu.
       Here it is your own face and nothing else, and it carries the tooltip
       saying whether other clients can see it. Without this it vanished at
       exactly the moment someone hovered to read that. */
    #chat-composer .sui-screen-portrait:hover .sui-screen-portrait-image {
      display: block;
    }

    /* ── Shared work ──────────────────────────────────────────────────── */
    /* Reuses the reference-card frame: a work offer IS a card about an object,
       and giving it its own chrome would make the same thing look like two. */
    .chat-work.chat-kind-offer { border-left-color: var(--text-warning); }
    /* A dead cycle: still readable as a record of what was asked, visibly not
       something to act on. */
    .chat-work.chat-mod-stale { opacity: .55; border-left-color: var(--border-subtle); }
    .chat-work.chat-kind-result { border-left-color: var(--accent-primary); }
    .chat-work-verdict {
      padding: var(--spacing-sm) var(--spacing-md) 0;
      font-family: 'DirectiveZero', sans-serif; font-size: 8px; line-height: 16px;
    }
    .chat-work-verdict.chat-mod-good { color: var(--text-player-primary); }
    .chat-work-verdict.chat-mod-bad { color: var(--text-enemy-primary); }

    /* ── Sharing what you are doing ───────────────────────────────────── */
    .chat-status-share { display: inline-flex; align-items: baseline; gap: var(--spacing-md); }

    /* ── Encrypted rooms ──────────────────────────────────────────────── */
    /* A statement of fact, not an error: the room works, this client cannot
       read it. */
    /* An upgraded room: the same shape of notice as encryption, because both
       are "this room works, but not the way you expect" — with a way out. */
    .chat-encrypted.chat-mod-moved { color: var(--text-body); }
    /* Nothing is arriving. Sits above every view, because a stall is not
       about the room you happen to be looking at. */
    .chat-encrypted.chat-mod-stalled {
      color: var(--text-warning);
      border-bottom-color: var(--text-warning);
    }
    .chat-encrypted {
      flex: 0 0 auto; align-self: stretch; text-align: left;
      display: flex; align-items: baseline; gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-hint); font-family: 'DirectiveZero', sans-serif; font-size: 8px; line-height: 16px;
    }

    /* ── Presence ─────────────────────────────────────────────────────── */
    /* Small and quiet. It is a fact about a person, not a call to action —
       and it sits beside a name that is already the point of the row. */
    .chat-presence {
      display: inline-block; width: 6px; height: 6px;
      margin-right: var(--spacing-sm); vertical-align: middle;
      background: var(--text-hint);
    }
    .chat-presence.chat-mod-online { background: var(--text-player-primary); }
    .chat-presence.chat-mod-idle { background: var(--text-warning); }
    /* Away is drawn, but dimmed almost out. Absent presence draws nothing at
       all — that is a different state and must not look like this one. */
    .chat-presence.chat-mod-away { background: var(--border-subtle); }

    /* ── Invitations ──────────────────────────────────────────────────── */
    /* Declining is quieter than accepting: both are one click, but only one
       of them is what the row is inviting you to do. */
    .chat-room-decline { color: var(--text-hint); }
    .chat-room-decline:hover { color: var(--text-enemy-primary); }

    /* ── Channel filter ───────────────────────────────────────────────── */
    #chat-room-filter { padding: var(--spacing-md); align-self: stretch; }
    #chat-room-filter .sui-input-text { width: 100%; }

    /* ── Muted ────────────────────────────────────────────────────────── */
    .chat-room-muted { color: var(--text-hint); margin-right: var(--spacing-sm); }

    /* ── Seen ─────────────────────────────────────────────────────────── */
    /* Quieter than the typing line above it: "someone is answering" is news,
       "someone has read it" is reassurance. */
    .chat-seen {
      flex: 0 0 auto; align-self: stretch; text-align: right;
      padding: 0 var(--spacing-md) var(--spacing-sm);
      color: var(--text-hint); font-family: 'DirectiveZero', sans-serif; font-size: 8px; line-height: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Edit ─────────────────────────────────────────────────────────── */
    .chat-msg .chat-edit-btn { opacity: 0; transition: opacity .1s; }
    .chat-msg:hover .chat-edit-btn,
    .chat-msg .chat-edit-btn:focus { opacity: 1; }
    /* Always visible, unlike the controls: this is a fact about the message,
       not an action on it. */
    .chat-reply-chip.chat-mod-editing .chat-reply-who { color: var(--text-warning); }

    /* ── Delete ───────────────────────────────────────────────────────── */
    .chat-msg .chat-delete-btn { opacity: 0; transition: opacity .1s; }
    .chat-msg:hover .chat-delete-btn,
    .chat-msg .chat-delete-btn:focus { opacity: 1; }
    /* Armed: visible whether or not the pointer is on the message, because a
       control waiting for a second click must not be able to hide. */
    .chat-msg .chat-delete-btn.chat-mod-armed {
      opacity: 1;
      outline: 1px solid var(--text-enemy-primary);
      outline-offset: 1px;
    }

    /* ── Completion hint ──────────────────────────────────────────────── */
    /* One line, above the bar, while Tab is cycling. Empty most of the time,
       so it must take no space when it has nothing to say. */
    .chat-complete-hint {
      display: flex; align-items: center; gap: var(--spacing-md);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--surface-player-body);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-hint); font-family: 'DirectiveZero', sans-serif; font-size: 8px; line-height: 16px;
      text-align: left;
    }
    .chat-complete-hint:empty { display: none; }
    .chat-complete-id { color: var(--accent-secondary); flex: 0 0 auto; }
    .chat-complete-what {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-complete-of { flex: 0 0 auto; }

    /* ── Reactions ────────────────────────────────────────────────────── */
    .chat-reactions {
      display: flex; flex-wrap: wrap; gap: var(--spacing-sm);
      margin-top: var(--spacing-sm); align-self: stretch;
    }
    .chat-reaction {
      display: inline-flex; align-items: center; gap: var(--spacing-sm);
      padding: 1px var(--spacing-sm); line-height: 16px;
    }
    /* A key this window does not know is other people's text — an emoji from
       Element, a word from a bot. Give it a font that can render either, since
       the game's own face has no emoji coverage. */
    .chat-reaction-key {
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji',
                   'DirectiveZero', sans-serif;
      font-size: 8px;
    }
    /* The game's own hulls, at chip size.
       NOT `pixelated`, though this is pixel art and the portrait compositor
       deliberately is. That one ENLARGES 72px art, where nearest-neighbour
       keeps the edges hard. This REDUCES 128px art to 20, where the same
       filter keeps one pixel in six and throws the rest away — a destroyer
       came out as three unrelated dots. Downscaling wants the average. */
    .chat-reaction-struct {
      width: 20px; height: 20px;
      image-rendering: auto;
      display: block;
    }
    /* The struct sheet wraps to several rows; keep it from crowding the
       message it belongs to. */
    .chat-reactions { max-height: 30vh; overflow-y: auto; }
    .chat-reaction-count { font-family: 'Inter', sans-serif; font-size: 12px; }
    /* The picker's own offers read as outlines until taken, so the ones
       already on the message stay the ones that look filled in. */
    .chat-reaction.chat-mod-offer {
      border: 1px dashed var(--border-subtle);
      color: var(--text-hint);
    }
    .chat-reaction.chat-mod-offer:hover { border-color: var(--accent-primary); }
    .chat-reaction.chat-mod-offer.chat-mod-mine { border-style: solid; }

    .chat-msg .chat-react-btn { opacity: 0; transition: opacity .1s; }
    .chat-msg:hover .chat-react-btn,
    .chat-msg .chat-react-btn:focus { opacity: 1; }

    /* ── Replies ──────────────────────────────────────────────────────── */
    /* A pointer back, not a copy: the message it answers is already up there.
       One line, clipped, dimmer than the message it belongs to. */
    .chat-reply-quote {
      display: flex; align-items: baseline; gap: var(--spacing-sm);
      margin: 0 0 var(--spacing-xs) 0; padding-left: var(--spacing-sm);
      border-left: 2px solid var(--border-subtle);
      color: var(--text-hint); font-family: 'DirectiveZero', sans-serif; font-size: 8px; line-height: 16px;
      overflow: hidden;
    }
    .chat-reply-quote:hover { border-left-color: var(--accent-primary); }
    /* A thread this window does not draw. Marked differently from a reply so
       the two are not mistaken for each other. */
    .chat-reply-quote.chat-mod-thread { border-left-style: dashed; }
    .chat-reply-who { color: var(--accent-secondary); flex: 0 0 auto; }
    .chat-reply-text {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Where a jump lands. Brief on purpose — it answers "which one" and then
       gets out of the way. */
    .chat-msg.chat-mod-found { background: var(--surface-player-body); }

    .chat-reply-chip {
      display: flex; align-items: center; gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--surface-player-body);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-hint); font-family: 'DirectiveZero', sans-serif; font-size: 8px; line-height: 16px;
      text-align: left;
    }
    .chat-reply-chip .chat-reply-text { flex: 1 1 auto; min-width: 0; }
    .chat-reply-cancel { flex: 0 0 auto; }

    .chat-msg .chat-reply-btn { opacity: 0; transition: opacity .1s; }
    .chat-msg:hover .chat-reply-btn,
    .chat-msg .chat-reply-btn:focus { opacity: 1; }

    /* ── Pinned ───────────────────────────────────────────────────────── */
    .chat-pins {
      align-self: stretch; text-align: left;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface-player-body);
    }
    .chat-pins-head {
      display: flex; align-items: center; gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      text-transform: uppercase; color: var(--text-hint);
    }
    .chat-pins-head:hover { color: var(--accent-primary); }
    .chat-pins-label { flex: 1 1 auto; }
    /* Bounded: a room is free to pin ten things, and this sits above the
       conversation rather than replacing it. */
    .chat-pins-body { max-height: 30vh; overflow-y: auto; }
    .chat-pins-note { padding: var(--spacing-md); color: var(--text-hint); }
    .chat-pin { align-self: stretch; }

    /* On hover, not always: a column of beacons down a conversation nobody is
       pinning is noise. Kept visible once a message IS pinned — that is state,
       and state you can only see by hovering is state you do not know. */
    .chat-msg .chat-pin-btn { opacity: 0; transition: opacity .1s; }
    .chat-msg:hover .chat-pin-btn,
    .chat-msg .chat-pin-btn:focus { opacity: 1; }
    .chat-msg .chat-pin-btn .sui-text-warning { opacity: 1; }
    .chat-msg:has(.sui-text-warning) .chat-pin-btn { opacity: 1; }

    /* ── Search ───────────────────────────────────────────────────────── */
    #chat-search-box { padding: var(--spacing-md); align-self: stretch; }
    #chat-search-box .sui-input-text { width: 100%; }
    .chat-search-hit {
      align-self: stretch; text-align: left;
      padding: var(--spacing-sm) 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .chat-search-hit:last-child { border-bottom: none; }
    /* The room is the part of a hit you cannot infer from the message, and it
       is what makes the result worth clicking. Small and above, so it labels
       the message rather than competing with it. */
    .chat-search-hit-room {
      display: flex; align-items: center; gap: var(--spacing-sm);
      padding: 0 var(--spacing-md);
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      text-transform: uppercase; color: var(--text-hint);
    }
    .chat-search-hit-room:hover { color: var(--accent-primary); }

    /* ── Notices ──────────────────────────────────────────────────────── */

    /* Connection ladder: one row per step of the sign-in chain, so a failure
       says WHICH hop failed instead of "login failed". */
    /* .sui-data-card-body is a flex column with align-items:flex-start, so a
       child shrinks to its content unless it says otherwise. Both row types
       below need the card's full width to justify against. */
    .chat-step { display: flex; align-items: center; gap: var(--spacing-sm);
      align-self: stretch; }
    .chat-step-state { flex: 0 0 auto; width: 16px; text-align: center; }
    .chat-step-label { line-height: 16px; }
    /* The mark carries the same colour as its label — at 16px the glyphs alone
       are too close to read apart at a glance. */
    .chat-step.chat-mod-done .chat-step-label,
    .chat-step.chat-mod-done .chat-step-state { color: var(--text-player-primary); }
    .chat-step.chat-mod-active .chat-step-label,
    .chat-step.chat-mod-active .chat-step-state { color: var(--text-warning); }
    .chat-step.chat-mod-todo .chat-step-label,
    .chat-step.chat-mod-todo .chat-step-state { color: var(--text-hint); opacity: .5; }
    .chat-step.chat-mod-failed .chat-step-label,
    .chat-step.chat-mod-failed .chat-step-state { color: var(--text-enemy-primary); }
    .chat-step-detail { color: var(--text-hint); word-break: break-all; }

    .chat-kv { display: flex; justify-content: space-between; gap: var(--spacing-md);
      padding: var(--spacing-xs) 0; align-self: stretch; }
    .chat-kv > :first-child { color: var(--text-hint); white-space: nowrap; }
    /* Break between words, not inside them: `word-break: break-all` split
       "blocks" across two lines as "bloc / ks". Long unbroken tokens (ids,
       hashes) still wrap, via overflow-wrap. */
    .chat-kv > :last-child {
      color: var(--text-body); text-align: right;
      word-break: normal; overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

<div id="menu-page-layout">

  <div id="menu-page-panel" class="sui-panel sui-theme-player">
    <div class="sui-panel-top-fill-background"></div>
    <div class="sui-panel-bottom-fill-background"></div>
    <div class="sui-panel-edge-left"></div>
    <div id="menu-page-panel-chunk" class="sui-panel-chunk sui-mod-grow sui-mod-shrink">

      <div id="menu-page-nav" class="sui-screen sui-screen-full-width">
        <div class="sui-screen-nav">
          <!-- Left: the networks this player can reach. In the game these are
               the menu's sections; here they are the federated homeservers,
               which is the same "where am I" job in the same slot. -->
          <div id="menu-page-nav-items" class="sui-screen-nav-items"></div>

          <div id="chat-nav-actions">
            <a id="chat-nav-comms" href="javascript:void(0)" title="Channels">
              <i class="sui-icon-sm icon-phone"></i>
            </a>
            <a id="chat-nav-settings" href="javascript:void(0)" title="Connection">
              <i class="sui-icon-sm icon-menu"></i>
            </a>
            <a id="menu-page-nav-close" class="sui-screen-nav-close" href="javascript:void(0)" title="Close">
              <i class="sui-icon-sm icon-close"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="height-100 sui-screen sui-screen-full-width sui-screen-shrink">
        <div id="menu-page-screen-body" class="height-100 sui-page-body-screen">
          <div id="menu-page-body-content"></div>
        </div>
      </div>

      <!-- The composer lives HERE, a sibling of the screen rather than a child
           of it — which is where the game puts its HUD action bars. Inside the
           screen it sat behind that screen's 2px border and the panel chunk's
           8px frame, leaving a dark band under the bar. Out here it is the
           bottom edge of the panel, flush to the frame. -->
      <div id="chat-composer-host"></div>

    </div>
    <div class="sui-panel-edge-right"></div>
  </div>

</div>

<!-- Portrait composer first: chat.js aliases it at module load. -->
<script src="chatrow.js"></script>
<script src="pfp.js"></script>
<script src="chat.js"></script>
</body>
</html>
