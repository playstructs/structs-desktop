<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Structs</title>
  <!-- All four, in this order. Linking only main.css gets the colours but
       neither the FONT nor any SUI component. -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/structicons.css">
  <link rel="stylesheet" href="css/sui/sui.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="playercard.css">
  <link rel="stylesheet" href="pet.css">
</head>
<body class="pet-body">
  <!-- Bottom-aligned on purpose. The window is transparent, so the room above
       the portrait costs the player nothing while it is empty — and when
       there IS something to say, the note grows upward into it rather than
       pushing the character around the screen. -->
  <div id="pet" class="pet">
    <a id="pet-close" class="pet-close" href="javascript:void(0)" title="Hide the companion">
      <i class="sui-icon icon-close sui-icon-sm"></i>
    </a>
    <!-- Hidden until there is something worth interrupting for. Most of the
         time this window is a character and nothing else. -->
    <a id="pet-note" class="pet-note" href="javascript:void(0)" hidden></a>
    <div id="pet-portrait" class="pet-portrait" title="Drag to move">
      <canvas id="pet-spark" class="pet-spark" width="128" height="128" aria-hidden="true"></canvas>
    </div>
  </div>
  <script src="bridge.js"></script>
  <script src="events.js"></script>
  <script src="pfp.js"></script>
  <script src="playercard.js"></script>
  <script src="units.js"></script>
  <script src="pet.js"></script>
</body>
</html>
