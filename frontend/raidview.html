<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Structs — Raid View</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/structicons.css" />
  <link rel="stylesheet" href="css/sui/sui.css" />
  <!-- The GAME's own stylesheet, so the HUD panels below are styled by the
       exact rules that style them in play rather than by a lookalike.
       Safe to load wholesale: its 2x/4x viewport scaling is scoped to the
       game's own ids (#hud-container, #raid-map-container, …), none of which
       exist here — this document uses #rv-* — so nothing double-scales on
       top of the map's own integer scaler. Its only global rules are
       html/body height. -->
  <link rel="stylesheet" href="css/main.css" />
  <!-- The chat message row, shared with the other window that draws one. -->
  <link rel="stylesheet" href="chat-rows.css" />
  <style>
    /* ── Raid View ────────────────────────────────────────────────────────
       A read-only spectator. This document deliberately does NOT load the
       game bundle: it shares an origin with the game (both are served from
       tauri://localhost), so booting index.html here would share localStorage
       — which holds the mnemonic — resume proof-of-work whose task registry is
       keyed on struct id (duplicate tasks cancel each other), and double-answer
       broadcast signing requests. Tauri applies initialization_script per
       window, and raid-* windows are built without one. Nothing below can
       sign, mine, or write.

       The layout re-derives the game's own map geometry from MapConstants
       rather than reusing MapComponent, which cannot be reused here: its
       struct lookup is hardcoded to five keyPlayers buckets (one spectated
       planet per GameState) and it uses bare struct ids as DOM ids, so two
       windows on one planet would collide. Every id here is window-scoped. */

    *, *::before, *::after { box-sizing: border-box; }
    /* ...except the handful of SUI components sized to a FIXED content width.
       `.sui-screen-battery` is `width: 36px` with a 2px themed border: five
       4px chunks and four 4px gaps fit that content box EXACTLY. Under a
       border-box reset the content is 32px, the chunks flex-shrink to
       3.203125px, and pixel art at a fractional width is mush — which is what
       "the charge bars are wonky, the real map looks cleaner" was. The game
       has no reset at all (normalize.css scopes box-sizing to `legend` and the
       radio/checkbox inputs), so these are restored to the box model they were
       drawn in.

       NAMED, not `[class^="sui-"]`. Exempting every SUI class was the first
       attempt and it broke the window: components sized `width: 100%` then
       added their padding and border OUTSIDE that 100% and overflowed their
       parent by exactly that much — `.sui-data-card-body` by 34px,
       `.sui-page-body-screen` by 20px — so `#board-layout` clipped 26px off
       the right of every page. Only fixed-px components belong here. */
    .sui-screen-battery,
    .sui-screen-properties,
    .sui-result-row-portrait,
    .sui-result-row-portrait-image { box-sizing: content-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--page-background);
      color: var(--text-body);
      font-family: 'DirectiveZero', sans-serif;
      /* ROW now: the left column holds map + battle log, and Comms is a rail
         down the right at full window height. */
      display: flex; flex-direction: row;
      /* The HUD is absolutely positioned against the window, the way the
         game's is — this is its containing block. */
      position: relative;
    }

    /* ── HUD ──────────────────────────────────────────────────────────────
       OVERLAYS the map, exactly as the game's does — the game's HUD floats
       above its map container rather than occupying a header row, and a
       header row was the single biggest thing making this window read as a
       tool rather than as the game. Panels place themselves via main.css's
       .status-bar-panel-top-* / .action-bar-bottom-* rules; the anchor here
       only has to be full-bleed and non-blocking. */
    /* The stage is map + HUD. Giving the HUD its own containing block means
       the battle log docks BELOW it rather than covering the action bars —
       the HUD stays pinned to the map it describes, at any log height. */
    /* min-width:0 matters: without it the left column refuses to shrink below
       its map's intrinsic width and the rail is pushed off-window. */
    #rv-left {
      flex: 1 1 auto; min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
    }
    #rv-stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
    #rv-hud {
      position: absolute; inset: 0; z-index: 40;
      pointer-events: none;              /* the map still scrolls underneath */
    }
    /* Re-enable pointer events only on the panels, so tooltips work while
       the rest of the overlay stays transparent to the mouse. */
    #rv-hud > * { pointer-events: auto; }
    /* Inert by construction: nothing here binds a listener, but make that
       visible too — no hand cursor promising an action that never comes. */
    #rv-hud a { cursor: default; }

    /* Viewport scaling, matching the game EXACTLY (main.css breakpoints):
       the HUD paints at 2x from 1152px and 4x from 2304px, with the element
       shrunk to 50%/25% of the viewport so the scaled result still fills it.
       Without this the HUD would stay 1x while the map's own integer scaler
       grew, and the two would visibly disagree about how big the world is.
       Transform + viewport-unit compensation is used rather than `zoom` for
       the reason recorded in main.rs: standardized CSS zoom stopped dividing
       viewport units, which cropped the whole app to its top-left quarter. */
    /* PERCENTAGES, not viewport units.
     *
     * The compensation has to be relative to the HUD's CONTAINER — the stage —
     * not to the window. With `vw`/`vh` the HUD kept filling the whole window
     * after the Comms rail took a column off the right: the top-right status
     * panel landed on top of the rail, and the bottom action bar sat over the
     * battle log. `inset: 0` already sizes this to the stage; 50% + scale(2)
     * reproduces the same pixel scaling within it, and now follows the stage
     * whatever else shares the window. */
    @media only screen and (min-width: 1152px), only screen and (min-height: 1024px) {
      #rv-hud {
        transform: scale(2); transform-origin: 0 0;
        width: 50%; height: 50%;
      }
    }
    @media only screen and (min-width: 2304px), only screen and (min-height: 2048px) {
      #rv-hud {
        transform: scale(4); transform-origin: 0 0;
        width: 25%; height: 25%;
      }
    }

    /* Where you are + how fresh the feed is. The game needs neither (a player
       knows where they are, and their own client is the feed). */
    /* Typography comes from the Design System's named text styles, applied as
       the shipped classes (`sui-text-label` = ExtremeHazard 8px, uppercase) —
       not re-declared here with magic numbers that would drift from it. */
    #rv-where-chip {
      /* BELOW the status panels, not level with them: the two panels are
         pinned to the top corners, and a centred chip on the same line
         overprints them as soon as the window is narrow. 38px clears a
         panel in the HUD's own (pre-scale) coordinate space, so it stays
         clear at 1x, 2x and 4x alike. */
      position: absolute; top: 38px; left: 50%; transform: translateX(-50%);
      max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: var(--spacing-md); white-space: nowrap;
      padding: var(--spacing-xs) var(--spacing-md); border: 1px solid var(--border-subtle);
      background: rgba(26, 32, 41, .88);
      color: var(--text-player-primary);
    }
    .rv-live-dot { color: var(--text-hint); }
    .rv-live-dot.stale { color: var(--text-warning); }
    .rv-live-dot.dead { color: var(--text-enemy-primary); }

    /* Tile selection. The ring art is the game's own (img/focus/*), and the
       INFO it opens is the point: a spectator cannot act on a struct, but
       wants to know what it is, how hurt it is and whether it is online.
       Actions stay absent rather than present-but-dead. */
    .rv-mount { cursor: pointer; }
    .rv-focus-ring {
      position: absolute; inset: 0; z-index: 515; pointer-events: none;
      background-repeat: no-repeat; background-position: center;
      image-rendering: pixelated;
    }
    .rv-focus-ring.rv-friendly { background-image: url("img/focus/focus-friendly.png"); }
    .rv-focus-ring.rv-enemy    { background-image: url("img/focus/focus-enemy.png"); }
    /* Defence web: selection-scoped lines from defenders to their ward.
       Inside #rv-map so it zooms with the board; under the focus ring (515)
       and above tiles. Dot marks the DEFENDING end. */
    .rv-defweb { position: absolute; left: 0; top: 0; z-index: 510; pointer-events: none; }
    .rv-defweb line {
      stroke: var(--text-player-primary); stroke-width: 2;
      stroke-dasharray: 6 4; opacity: .85;
    }
    .rv-defweb circle { fill: var(--text-player-primary); opacity: .9; }
    .rv-defweb.rv-defweb-enemy line { stroke: var(--text-enemy-primary); }
    .rv-defweb.rv-defweb-enemy circle { fill: var(--text-enemy-primary); }
    /* Portrait hover. sui.css hides the pfp on hover and reveals an icon in its
       place — but it reveals `icon-menu` under the PLAYER theme and `icon-info`
       only under the ENEMY one. This window uses `icon-info` on BOTH portraits
       on purpose (a spectator has no menu to open, and a menu glyph would
       promise one), so under the player theme the hover hid the face and
       revealed nothing: an empty lit panel that read as a rendering glitch.
       Reveal our icon in that theme too, in the theme's own accent. */
    .sui-theme-player .sui-screen-portrait:hover i.icon-info {
      display: inline-block;
      color: var(--accent-primary);
    }

    /* Empty tiles are selectable too — the Design System's Action Chunk has a
       documented empty-tile form. The game marks the chosen tile in its own
       selection layer; here the same job is one outline, tinted by side. */
    .rv-cell { cursor: pointer; }
    .rv-cell.rv-tile-selected {
      outline: 2px solid var(--text-player-primary);
      outline-offset: -2px;
    }
    .rv-cell.rv-tile-selected.rv-enemy-side {
      outline-color: var(--text-enemy-primary);
    }

    /* The Cheatsheet is a POPOVER (Design System: "a popover used to display
       information about an ability or Struct"), appended to <body> and
       positioned fixed, so nothing here can clip it. Nothing of ours styles
       it: sui.css already gives it its frame, its min-width and its
       --popup-z-index, and re-declaring any of that would only let it drift. */

    /* Fog of war — the game's own art. main.css declares these with ABSOLUTE
       `/img/...` urls, which resolve differently depending on how the document
       is served, so they are re-declared here with relative paths (the same
       trap that made SUI form art invisible on the board). */
    .rv-fog {
      position: absolute; top: 0; bottom: 0; z-index: 30;
      display: flex; flex-direction: row; flex-wrap: nowrap;
      justify-content: flex-start; pointer-events: none;
    }
    .rv-fog-edge {
      background: url("img/tiles/fog-of-war/fog-of-war-left.png") repeat-y top left;
      height: 100%; width: var(--tile-width);
      flex: 0 0 var(--tile-width);
      image-rendering: pixelated;
    }
    .rv-fog-body {
      background: url("img/tiles/fog-of-war/fog-of-war-middle.png") repeat top left;
      height: 100%; flex-grow: 1; image-rendering: pixelated;
    }

    /* ── Battle log ───────────────────────────────────────────────────── */
    #rv-log {
      flex: none; z-index: 45;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-default);
      display: flex; flex-direction: column; min-height: 0;
      max-height: 45%;
    }
    #rv-log.rv-collapsed #rv-log-body { display: none; }
    /* The bar is its OWN band, never an overlay. Floating it over the board to
       win back its 31px was tried and reverted: a translucent strip with the
       map showing through behind the action-bar icons and the filter chips
       reads as clutter, and 31px is not worth it. */
    #rv-log-head {
      flex: none; display: flex; align-items: center; gap: var(--spacing-md);
      padding: var(--spacing-sm) var(--spacing-lg); color: var(--text-hint);
    }
    #rv-log-head .rv-spacer { flex: 1 1 auto; min-width: 0; }
    /* ── The bar must survive a narrow window ──────────────────────────────
       Five category chips plus two controls need more width than a small
       window has. Unmanaged, the flex row squeezed everything at once: the
       "Battle log" label wrapped onto two lines and "FIT ALL" was clipped to
       "FI AL". The controls on the right are the only things here you can
       CLICK, so they never shrink; the chips are the elastic part and scroll
       sideways instead. */
    #rv-log-head > .sui-text-label,
    #rv-log-head > span:first-of-type,
    .rv-log-count,
    #rv-log-head .rv-log-toggle { flex: none; white-space: nowrap; }
    #rv-log-head { flex-wrap: nowrap; }
    .rv-log-filters { display: inline-flex; gap: var(--spacing-sm); margin-left: var(--spacing-md);
      flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .rv-log-filters::-webkit-scrollbar { display: none; }
    .rv-log-filters > * { flex: none; }
    .rv-log-count { color: var(--text-body); }
    .rv-log-toggle { color: var(--text-player-primary); text-decoration: none; }
    /* Separated from the log's own show/hide so the two reads as two controls
       rather than one pair of words. */
    .rv-fit-toggle { margin-left: var(--spacing-lg); padding-left: var(--spacing-lg);
      border-left: 1px solid var(--border); }
    #rv-log-body { overflow: auto; padding: 0 var(--spacing-lg) var(--spacing-md); }
    /* Same frame as the battle log beneath it: two panels about the same
       planet should not look like two different kinds of thing. */
    /* Same stacking as the battle log above it. Without this the panel
       defaulted to `z-index: auto` and the bottom-left action bar — which is
       absolutely positioned over the whole lower-left corner — painted across
       its header, leaving "…cuss  hide" showing and the label hidden. */
    #rv-chat {
      position: relative; z-index: 45;
      border-left: 1px solid var(--border-subtle);
      /* A rail, not a strip: fixed width, full height, its body taking the
         slack so the newest line sits at the bottom like any chat. */
      flex: 0 0 clamp(240px, 26vw, 340px);
      display: flex; flex-direction: column; min-height: 0;
    }
    /* The charge battery is a fixed 36px component (5 chunks + 4 gaps) sitting
       in a screen sized by the PORTRAIT above it, which is wider. Left-aligned
       by default, that put all the slack on one side and read as a bar that
       did not fit its section. Centred, the two stack as one unit.
       The composer's battery is the same component in the same arrangement,
       so it wants the same rule rather than a second one. */
    #rv-hud .sui-screen-battery,
    #rv-chat-entry .sui-screen-battery { margin-left: auto; margin-right: auto; }

    /* The composer is the Comms window's OWN panel, built by
       `StructsChatRow.composer()`. This file used to draw a lookalike — a bare
       input in a screen frame — which is what made the rail read as a
       different product. Only the fit is set here: the panel is narrow, and
       the portrait well and button are fixed while the message grows. */
    #rv-chat-entry .sui-panel { width: 100%; }
    #rv-chat-entry .sui-panel-chunk.sui-mod-grow { min-width: 0; }
    /* The portrait is SUI's own size.
       It was pinned to 32px to save rail width. `.sui-screen-portrait` is
       40px in SUI, and shrinking it squeezed the face inside a frame drawn
       for 40 — while saving nothing, because the chunk's width was set by the
       48px spacer beside it, not by the portrait. The spacer is now the 36px
       battery, so the chunk is NARROWER at the real size than it was at the
       fake one. */
    #rv-chat-entry .pfp-viewer-layer { image-rendering: pixelated; }
    /* The portrait stays at every width.
       It was dropped below a ~300px rail to buy the message room, on the
       reasoning that this window is never in doubt about who you are. That was
       wrong from the reader's side: the rail is the one place in the app you
       speak from without a name anywhere on screen, and the two portraits
       directly above it are the OTHER two players. Yours belongs beside them.

       What it costs, measured at the rail's 240px floor: the message field
       goes 81px -> 71px. Dropping the connector between the portrait and the
       message gives 10px of that back, which is the whole reason that join
       carries a hook class. The portrait chunk itself cannot go below 48px —
       `.sui-panel-chunk-spacer-indicator` is SUI's art and fixed — so a
       smaller well would shrink the face without buying a pixel. */
    @media (max-width: 1150px) {
      #rv-chat-entry .chat-composer-portrait-join { display: none; }
    }
    /* The header is SUI's `.sui-page-header`, the same component the Comms
       window's room page uses, so nothing about its shape is set here. Only
       the unread count, which is this rail's own. */
    #rv-chat-head { flex: 0 0 auto; }
    /* The topic is a sentence, not a name, so it has to be allowed to run out
       of room gracefully in a 240px rail. */
    #rv-chat-head .sui-nav-btn { min-width: 0; }
    #rv-chat-head .rv-chat-title {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* The timeline is `.chat-scroll` from the shared stylesheet. The one thing
       that differs: a rail is tall and usually near-empty, so the newest line
       sits next to the composer instead of stranded at the top. */
    #rv-chat-body { justify-content: flex-end; }
    /* The message row itself is `chat-rows.css`, linked above and shared
       with the Comms window. This file used to carry a careful imitation of
       it — same intent, separate spelling — which is precisely how the two
       drifted. What is left here is the RAIL's own chrome: the panel, the
       composer, and where a room name goes when the panel is searching. */
    .rv-chat-room {
      margin-left: auto; flex: 0 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: 'ExtremeHazard', sans-serif; font-size: 8px; line-height: 16px;
      color: var(--text-hint); opacity: .7;
    }
    /* ── Composer ───────────────────────────────────────────────────────── */
    /* The FIELD is SUI's (`label.sui-input-text`), not a hand-rolled input.
       The previous version drew its own box out of `--input-background` and
       `--border` — and `--input-background` does not exist, so the fallback
       painted a colour this window invented. That is what made the rail read
       as a web form dropped into a pixel-art game. */
    #rv-chat-compose {
      flex: 0 0 auto;
      padding: var(--spacing-sm) var(--spacing-md) var(--spacing-sm);
      border-top: 1px solid var(--border-subtle);
      display: flex; flex-direction: column; gap: var(--spacing-xs);
    }
    /* No local `.hidden` rules in this file: main.css already ships
       `.hidden { display: none !important }` and it is linked above. Three
       restatements of it lived here, which is how a design system quietly
       gets forked — and one of them was written believing none existed. */
    #rv-chat-error:empty { display: none; }
    /* "enemy" is the game's semantic for danger; there is no --text-error. */
    #rv-chat-error { color: var(--text-enemy-primary); }
    /* Rows sit closer here than in the Comms window: a rail beside a live map
       is a glance, not a reading position. */
    .chat-msg + .chat-msg { margin-top: var(--spacing-sm); }
    /* Something was said while the panel was closed. */
    #rv-chat-head.rv-chat-fresh .rv-log-count { color: var(--text-warning); }
    .rv-log-empty { color: var(--text-hint); padding: var(--spacing-sm) 0; }
    .rv-log-row {
      /* Labels are single words now (see LOG_LABEL), so the column can be
         narrow AND nowrap: every row is exactly one line tall, which is what
         makes a few hundred of them skimmable. An unknown future category
         falls back to its humanised chain name and is ellipsised rather than
         being allowed to wrap and break the rhythm. */
      display: grid; grid-template-columns: 62px 78px 1fr; gap: var(--spacing-md);
      align-items: baseline; padding: var(--spacing-xs) 0;
      border-bottom: 1px solid var(--border-subtle);   /* rgba(57,73,88) IS this token */
    }
    .rv-log-t { color: var(--text-hint); font-variant-numeric: tabular-nums; }
    .rv-log-cat {
      color: var(--text-player-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rv-log-row.rv-bad .rv-log-cat { color: var(--text-enemy-primary); }
    .rv-log-row.rv-warn .rv-log-cat { color: var(--text-warning); }
    .rv-log-row.rv-dim .rv-log-cat { color: var(--text-hint); }
    .rv-log-d { color: var(--text-body); word-break: break-word; text-align: left; }
    #rv-log-body, .rv-log-row { text-align: left; }

    /* Combat is the story; bookkeeping is context. A left rule and a brighter
       detail line give an attack visible weight in a list where thousands of
       status flags otherwise look identical to it. */
    .rv-log-row.rv-k-combat {
      border-left: 2px solid var(--text-enemy-primary);
      padding-left: var(--spacing-md); margin-left: -var(--spacing-md);
    }
    .rv-log-row.rv-k-state .rv-log-d { color: var(--text-hint); }

    /* Day break. Rows arrive newest-first; without this a list crossing
       midnight reads as unsorted. Sticky so the day stays legible while
       scrolling a long log. */
    .rv-log-day {
      position: sticky; top: 0; z-index: 1;
      padding: var(--spacing-sm) 0 var(--spacing-xs); margin-top: var(--spacing-sm);
      color: var(--text-hint);
      background: var(--surface-default);
      border-bottom: 1px solid var(--border-subtle);
    }
    .rv-log-day:first-child { margin-top: 0; }

    /* Filter strip in the log header. */
    .rv-log-chip {
      display: inline-flex; align-items: center; gap: var(--spacing-sm);
      padding: 1px var(--spacing-sm); text-decoration: none;
      border: 1px solid var(--border-subtle);
      color: var(--text-hint); opacity: .55;
    }
    .rv-log-chip.rv-on { opacity: 1; border-color: var(--border); }
    .rv-log-chip .rv-bad { color: var(--text-enemy-primary); }
    .rv-log-chip .rv-warn { color: var(--text-warning); }
    .rv-log-chip .rv-dim { color: var(--text-hint); }
    .rv-log-chip-n { color: var(--text-hint); font-variant-numeric: tabular-nums; }

    /* ── Map ──────────────────────────────────────────────────────────────
       Plain DOM + CSS background tiles, exactly the technique the game uses —
       no canvas, no WebGL, no sprite sheets. --tile-width/--tile-height come
       from sui.css (128px). */
    /* `position + z-index` makes this a STACKING CONTEXT. Without it the
       map's internal layers (markers at ~500, status badges at 520) compete
       directly with the HUD's z-index and paint over it — a marker was
       covering the selected struct's readout. Contained here, every map layer
       stays below the HUD however high its own z-index climbs. */
    #rv-scroll { flex: 1 1 auto; overflow: auto; padding: var(--spacing-xl);
      position: relative; z-index: 0; }
    /* margin: auto, not flex centering — a centered flex child that overflows
       clips its left edge unreachably; margins degrade to scrollable. */
    #rv-map { position: relative; width: -moz-fit-content; width: fit-content;
      margin: 0 auto; }
    .rv-row { display: flex; }
    .rv-cell {
      position: relative; flex: none;
      width: var(--tile-width); height: var(--tile-height);
      background-repeat: no-repeat; background-position: center;
      image-rendering: pixelated;
    }
    .rv-tile, .rv-marker, .rv-pip-mask, .rv-pip-focus { image-rendering: pixelated; }
    /* Hidden-during-animation still (the game's .invisible). */
    .rv-invisible { visibility: hidden; }
    /* Concurrent animation layers stack inside the one mount. */
    .rv-anim-layer { position: absolute; inset: 0; }
    /* The game mirrors every impact_* and destroy_* layer (sui-flip-horizontal
       in MapStructViewerComponent); the bundles are authored facing the other
       way. Applied per layer, so it composes with the attacker mount's flip. */
    .rv-anim-layer.rv-flip-layer, .rv-anim.rv-flip-layer { transform: scaleX(-1); }
    /* Offline badge, top-right of the tile. */
    /* Status indicators: BOTTOM of the tile, centred across its full width —
       `.map-struct-hud-status-indicators` verbatim (bottom 0, tile-width, 32px
       tall, centred both ways, 4px gap). They were pinned top-right, which put
       them over the health bar's corner instead of under the struct. */
    .rv-status-badges { position: absolute; bottom: 0; left: 0; z-index: 520;
      display: flex; width: 100%; height: 32px;
      align-items: center; justify-content: center; gap: var(--spacing-sm); }
    /* Transition rows: layers STACK inside one tile-height block (the game's
       .map-terrain-transition) — the previous ambit's edge-bottom under the
       next ambit's edge-top is what blends two bands together. */
    .rv-row.rv-transition { position: relative; height: var(--tile-height); }
    .rv-strip { position: absolute; top: 0; left: 0; display: flex; }
    .rv-tile { flex: none; width: var(--tile-width); height: var(--tile-height);
      background-repeat: no-repeat; background-position: center; }

    /* Slot markers: beacon on a buildable planetary slot, blocked art on an
       unusable cell — the game's MapTileMarkersComponent overlay. */
    /* DECORATION ONLY. The beacon sits at z-index 50, above the struct mount,
       so without this it is the click target on every planetary slot — the
       struct underneath never sees the event and selecting a planetary Struct
       silently selected its TILE instead ("WATER" + a beacon icon in the
       Action Bar). Fleet cells have no marker, which is why only the planetary
       half was broken. */
    .rv-marker { position: absolute; max-width: 100%; max-height: 100%;
      left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 50;
      pointer-events: none; }

    /* The mount a struct renders into. Attacker-side mounts are mirrored so
       raiders face the planet (.map-struct-layer-tile.mod-side-right). The
       HUD un-mirrors itself inside so text stays readable — the game keeps
       its HUD on a separate unflipped layer. */
    .rv-mount { position: absolute; inset: 0; }
    .rv-mount.rv-flip { transform: scaleX(-1); }
    .rv-mount.rv-flip .rv-hud { transform: scaleX(-1); }
    .rv-struct-wrap { position: absolute; inset: 0; }

    /* One struct: stacked absolutely-positioned PNG layers. The z-indices
       match the game's --struct-*-z-index so a weapon that renders over the
       hull in game renders over it here. */
    .rv-struct { position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; }
    .rv-struct img { position: absolute; max-width: 100%; max-height: 100%;
      z-index: 200; image-rendering: pixelated; }
    .rv-struct img.rv-top { z-index: 300; }
    .rv-struct img.rv-bottom { z-index: 100; }
    .rv-struct.rv-stealth { opacity: .5; }
    /* Lottie mounts here, above the still it is animating. */
    .rv-anim { position: absolute; inset: 0; z-index: 400; pointer-events: none; }

    /* HUD: segmented health (one cell per hit point) in a 48px dark box near
       the top of the tile — .map-struct-hud-status-bars + .struct-health-bar. */
    .rv-hud { position: absolute; inset: 0; z-index: 500; pointer-events: none; }
    /* `.map-struct-hud-status-bars`, matched exactly. The frame is a 2px
       border in the SAME colour as the fill (a real token, not the rgba I had
       guessed) and there is NO padding — my extra 2px of padding doubled the
       apparent border thickness. */
    .rv-hudbox { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; width: 48px; flex-direction: column;
      align-items: center; justify-content: center; gap: var(--spacing-xs);
      background-color: var(--border-neutral-dark);
      border: 2px solid var(--border-neutral-dark); }
    .rv-hp { display: flex; width: 100%; height: 4px;
      justify-content: space-between; gap: var(--spacing-xs); }
    .rv-seg { display: flex; flex: 1 1 100%;
      background: var(--struct-health-bar-damage); }
    .rv-seg.on { background: var(--struct-health-bar-health); }
    /* (No per-struct type caption: the real client draws a health bar and
       status icons on a struct tile and nothing else — confirmed by comparing
       the same art side by side against the running game. Identity comes from
       selecting the struct.) */

    /* Ambit band label down the left edge. */
    .rv-band { position: absolute; left: -14px; top: 0; bottom: 0; width: 12px;
      display: flex; align-items: center; justify-content: center; }
    /* Typography from `sui-text-label` (applied in markup); only the vertical
       orientation and colour are specific to this gutter. */
    .rv-band span { color: var(--text-hint);
      writing-mode: vertical-rl; text-orientation: mixed; }

    /* ── PiP bubble — combat happening off-screen ─────────────────────────
       Transcribed from the game's .map-pip: a fixed 128px viewer at mid-
       height that slides in from the LEFT for a defender-side struct and the
       RIGHT for an attacker-side one, only while an attack-sequence animation
       plays for a struct whose tile is fully outside the scroll viewport.
       The side class anchors the off-screen rest position; sliding is done by
       toggling rv-vis while the side class stays put, so the left/right jump
       from swapping sides is never visible. */
    #rv-pip {
      position: fixed;
      top: calc(50vh - 64px);
      width: 128px; height: 128px;
      z-index: 800;
      display: block;
      visibility: hidden;
      transition: left 0.3s ease-in-out, right 0.3s ease-in-out;
    }
    #rv-pip.rv-side-left  { visibility: visible; left: -200px; right: auto; }
    #rv-pip.rv-side-right { visibility: visible; left: auto; right: -200px; }
    #rv-pip.rv-side-left.rv-vis  { left: 26px; }
    #rv-pip.rv-side-right.rv-vis { right: 26px; }

    .rv-pip-mask {
      position: absolute; top: 0; left: 0;
      display: flex; box-sizing: border-box;
      width: 118px; height: 118px;
      /* Square: SUI sets `border-radius: 0` fourteen times over — the game is
         pixel art and every corner in it is a corner. This was copied from
         main.css's `.map-pip-mask`, which rounds because the GAME's pip sits
         over rounded chrome; ours does not. */
      margin: var(--spacing-sm);
      overflow: hidden; align-items: center; justify-content: center;
      background-repeat: no-repeat; background-position: center;
    }
    #rv-pip.rv-side-left  .rv-pip-mask { border: 1px solid var(--border-focus-friendly-dark); }
    #rv-pip.rv-side-right .rv-pip-mask { border: 1px solid var(--border-focus-enemy-dark); }

    .rv-pip-focus {
      position: relative; z-index: 10; display: flex;
      width: 128px; height: 128px;
      background-repeat: no-repeat; background-position: center;
    }
    #rv-pip.rv-side-left  .rv-pip-focus { background-image: url("img/focus/focus-friendly.png"); }
    #rv-pip.rv-side-right .rv-pip-focus { background-image: url("img/focus/focus-enemy.png"); }

    .rv-pip-caret-container {
      position: absolute; top: 0; left: 0;
      display: flex; width: 100%; height: 100%;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .rv-pip-caret { position: relative; display: inline-block; width: 12px; height: 36px; }
    #rv-pip.rv-side-left .rv-pip-caret {
      left: -71px;
      background: url("img/focus/focus-caret-friendly.png") no-repeat center/cover;
    }
    #rv-pip.rv-side-right .rv-pip-caret {
      left: 71px;
      background: url("img/focus/focus-caret-enemy.png") no-repeat center/cover;
      transform: scaleX(-1);
    }

    /* The struct (still + its own lottie mount) inside the mask; attacker-side
       content mirrored, exactly like its on-map tile. */
    .rv-pip-struct { position: absolute; top: 0; left: 0; width: 128px; height: 128px; }
    #rv-pip.rv-side-right .rv-pip-struct { transform: scaleX(-1); }
    .rv-pip-struct .rv-marker { z-index: 40; }

    /* ── End-of-raid banner ───────────────────────────────────────────── */
    #rv-banner {
      display: none; position: fixed; inset: 0; z-index: 900;
      align-items: center; justify-content: center; pointer-events: none;
    }
    #rv-banner svg { max-width: min(70vw, 640px); max-height: 50vh; }

    /* ── Status / empty states ────────────────────────────────────────── */
    /* An OVERLAY, not a flex sibling. #rv-stage is a flex ROW and this had
       `flex: none`, so once it appeared it claimed its full content width —
       768px of a 905px stage — and squeezed the board itself into a 137px
       sliver. It only ever appears on a CONTESTED planet (two fleets, not
       enough tiles), which is exactly the situation a raid spectator exists
       for, so the one case that mattered was the one that broke. */
    #rv-note {
      display: none;
      /* BOTTOM-centre, not top: the top-centre slot already belongs to the
         planet/status chip (#rv-where-chip at 38px), and the top corners to
         the two status panels. The strip between the two player portraits is
         the only band that is always free. */
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      z-index: 45; pointer-events: none;
      max-width: min(92%, 620px); padding: var(--spacing-sm) var(--spacing-lg);
      text-align: center; line-height: 1.4;
      background: rgba(13, 15, 21, .82);
      border: 1px solid var(--border);
      color: var(--text-warning);
    }
    #rv-note.on { display: block; }
    .rv-empty { display: flex; flex-direction: column; gap: var(--spacing-md);
      align-items: center; justify-content: center; padding: var(--spacing-xxxl) var(--spacing-xl);
      color: var(--text-hint); text-align: center; }
  </style>
</head>
<body>
  <!-- ── HUD ────────────────────────────────────────────────────────────
       The game's own HUD markup (StatusBarTopLeft/TopRight + two
       ActionBars), reproduced class-for-class so the shipped sui.css styles
       it identically. Every control is an <a href="javascript: void(0)">
       with NO listener bound: inert BY CONSTRUCTION rather than by a
       disabled flag someone could later wire up. A spectator maps onto the
       game's two-sided HUD naturally — defender on the left, raider on the
       right — so the same panels carry the same meaning here.
       `data-sui-tooltip` is live: it is pure information, which is exactly
       what a spectator wants. -->
  <!-- Map and battle log share the left column; Comms is a full-height rail
       beside them. A conversation wants VERTICAL room, and the map wants
       horizontal room — stacking chat under the map took the axis the map
       needed and gave the conversation the one it could not use. -->
  <div id="rv-left">
  <div id="rv-stage">
  <div id="rv-hud">
    <div id="rv-hud-tl" class="sui-status-bar-panel status-bar-panel-top-left sui-theme-player">
      <a class="sui-resource" href="javascript: void(0)"
         data-sui-tooltip="Energy Supply — the defender's capacity in use"
         data-sui-mod-placement="bottom">
        <!-- No text class: `.sui-resource` supplies the typography, exactly as
             StatusBarTopRightComponent leaves its own value span bare. -->
        <span id="rv-energy">—</span>
        <i class="sui-icon sui-icon-energy"></i>
      </a>
    </div>

    <div id="rv-hud-tr" class="sui-status-bar-panel status-bar-panel-top-right sui-theme-enemy">
      <a class="sui-resource" href="javascript: void(0)"
         id="rv-shield-res" data-sui-mod-placement="bottom">
        <div id="rv-shield-icon" class="planetary-shield-symbol-wrapper"></div>
        <span id="rv-shield" class="sui-text-warning">—</span>
      </a>
      <a class="sui-resource" href="javascript: void(0)"
         data-sui-tooltip="Alpha Ore stored on this planet"
         data-sui-mod-placement="bottom">
        <i class="sui-icon sui-icon-alpha-ore"></i>
        <span id="rv-ore">—</span>
      </a>
    </div>

    <!-- Bottom-left: the DEFENDER (this planet's owner). -->
    <div id="rv-hud-bl" class="sui-panel-wrapper-fit-content action-bar-bottom-left">
      <div class="sui-panel sui-theme-player">
        <div class="sui-panel-edge-left"></div>
        <div class="sui-panel-chunk">
          <div class="sui-screen">
            <a href="javascript: void(0)" class="sui-screen-portrait"
               id="rv-def-portrait" data-sui-mod-placement="top">
              <div class="sui-screen-portrait-image" id="rv-def-pfp"></div>
              <i class="sui-icon-md icon-info"></i>
            </a>
          </div>
          <!-- No share button here. This chunk is the DEFENDER's status —
               portrait then charge — and a control wedged between them split
               one unit into two unrelated tiles. Sharing lives in the Comms
               panel, next to the conversation it feeds. -->
          <div class="sui-screen">
            <div class="sui-screen-battery" id="rv-def-battery">
              <div class="sui-battery-chunk"></div><div class="sui-battery-chunk"></div>
              <div class="sui-battery-chunk"></div><div class="sui-battery-chunk"></div>
              <div class="sui-battery-chunk"></div>
            </div>
          </div>
        </div>
        <div id="rv-def-connector" class="sui-panel-connector hidden"></div>
        <div id="rv-def-chunk" class="sui-panel-chunk hidden"></div>
        <div class="sui-panel-edge-right"></div>
      </div>
    </div>

    <!-- Bottom-right: the RAIDER. Hidden until a raid is actually live, the
         same way the game hides its enemy action bar. -->
    <div id="rv-hud-br" class="sui-panel-wrapper-fit-content action-bar-bottom-right hidden">
      <div class="sui-panel sui-theme-enemy">
        <div class="sui-panel-edge-left"></div>
        <div id="rv-atk-chunk" class="sui-panel-chunk hidden"></div>
        <div id="rv-atk-connector" class="sui-panel-connector hidden"></div>
        <div class="sui-panel-chunk">
          <div class="sui-screen">
            <a href="javascript: void(0)" class="sui-screen-portrait"
               id="rv-atk-portrait" data-sui-mod-placement="top">
              <div class="sui-screen-portrait-image" id="rv-atk-pfp"></div>
              <i class="sui-icon-md icon-info"></i>
            </a>
          </div>
          <div class="sui-screen">
            <div class="sui-screen-battery" id="rv-atk-battery">
              <div class="sui-battery-chunk"></div><div class="sui-battery-chunk"></div>
              <div class="sui-battery-chunk"></div><div class="sui-battery-chunk"></div>
              <div class="sui-battery-chunk"></div>
            </div>
          </div>
        </div>
        <div class="sui-panel-edge-right"></div>
      </div>
    </div>

    <!-- Location + feed freshness. The game has no equivalent (a player
         always knows where they are); a spectator does not. -->
    <div id="rv-where-chip" class="sui-text-label">
      <span id="rv-where">—</span>
      <span id="rv-live" class="rv-live-dot" title="feed">connecting</span>
    </div>
  </div>

  <div id="rv-note"></div>

  <!-- The end-of-raid banner overlays the map; pointer-events:none so it
       never intercepts a scroll while it is playing out. -->
  <div id="rv-banner"></div>

  <!-- PiP bubble: mirrors the struct currently animating when its tile is
       fully off-screen. Structure matches the game's .map-pip markup. -->
  <div id="rv-pip">
    <div class="rv-pip-focus"></div>
    <div class="rv-pip-mask"><div class="rv-pip-struct" id="rv-pip-struct"></div></div>
    <div class="rv-pip-caret-container"><div class="rv-pip-caret"></div></div>
  </div>

  <div id="rv-scroll">
    <div id="rv-map">
      <div class="rv-empty" id="rv-boot">
        <i class="icon-in-progress"></i>
        <div>Waiting for the first snapshot…</div>
      </div>
    </div>
  </div>
  </div><!-- /#rv-stage -->

  <!-- Battle log. The one place the spectator is DELIBERATELY richer than
       the player's map: every planet_activity row for this planet, which the
       game itself never shows in one place. Collapsible so it can stay out of
       the way of the map it belongs to. -->
  <div id="rv-log" class="rv-collapsed">
    <div id="rv-log-head" class="sui-text-label">
      <i class="icon-list"></i>
      <span>Battle log</span>
      <span id="rv-log-count" class="rv-log-count"></span>
      <span id="rv-log-filters" class="rv-log-filters"></span>
      <span class="rv-spacer"></span>
      <a href="javascript: void(0)" id="rv-log-toggle" class="rv-log-toggle">show</a>
      <!-- Board zoom. Lives in this bar rather than over the map: the map is
           the thing being looked at, and a floating control would cover the
           very board it resizes. Labelled with the ACTION, matching the log
           toggle beside it ("show"/"hide"). -->
      <a href="javascript: void(0)" id="rv-fit-toggle" class="rv-log-toggle rv-fit-toggle">zoom in</a>
    </div>
    <div id="rv-log-body" class="sui-text-tiny"><div class="rv-log-empty sui-text-tiny">No recorded activity for this planet yet.</div></div>
  </div>

  </div><!-- /#rv-left -->

  <!-- What people have SAID about this planet, beside what happened to it.
       A spectator window is where you are already looking at the thing, so
       "has anyone mentioned this" is the question that belongs here.
       You can now answer from here too. The room is CHOSEN, never guessed:
       it defaults to wherever this object was last discussed and is a plain
       selector otherwise, which is the honest way to send from a window that
       is about an object rather than about a room. -->
  <!-- ALWAYS OPEN. There was a collapsed state; collapsed it was a tall empty
       column doing nothing but holding a "show" link, which is a worse use of
       the space than the conversation itself. The rail is either wanted or the
       window is not the raid view. -->
  <div id="rv-chat">
    <!-- The Comms room header: `sui-page-header` with the room's name, and
         the room's own topic under it. No tabs — there is one channel here,
         and a tab strip with a single tab is a control that decides nothing.
         No back chevron either, for the same reason: there is nowhere to go
         back TO. The "open in comms" link is gone; this IS the room. -->
    <div id="rv-chat-head" class="sui-page-header">
      <!-- The header IS the topic. The planet id was here too and is dropped:
           the map beside this panel already says which planet it is, in the
           banner across the top of it, so the rail was saying it twice. -->
      <a href="javascript: void(0)" class="sui-nav-btn" id="rv-chat-title-btn">
        <span class="rv-chat-title">Comms</span>
      </a>
      <span id="rv-chat-count" class="rv-log-count"></span>
    </div>
    <div id="rv-chat-body" class="chat-scroll sui-text-tiny">
      <!-- Replaced by renderChat on the first paint; the same notice block
           Comms uses, so the pre-JS frame does not flash a different shape. -->
      <div class="chat-notice"><div class="chat-notice-title">Quiet</div>
        <div class="sui-text-paragraph">Nothing has been said about this planet yet.</div></div>
    </div>
    <!-- Hidden until Comms is connected AND a room is known: a composer that
         cannot send is worse than no composer. -->
    <!-- The composer is BUILT, not written here: `StructsChatRow.composer()`
         is the same `sui-panel` the Comms window uses — portrait well, the
         message on an inset screen, and the send button as a `sui-panel-btn`.
         There is no room selector. This rail is the planet's channel and
         nothing else; picking a different one was never what it meant. -->
    <div id="rv-chat-compose" class="hidden">
      <div id="rv-chat-entry"></div>
      <div id="rv-chat-error" class="sui-text-tiny"></div>
    </div>
  </div>

  <script src="js/vendor/lottie-5.12.2.min.js"></script>
  <!-- Portrait composer first: raidview.js calls it from the commander HUD. -->
  <!-- The shared chat row: this window draws the same one Comms does. -->
  <script src="chatrow.js"></script>
  <script src="pfp.js"></script>
  <script src="raidview.js"></script>
</body>
</html>
