<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Structs — Raid View</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/structicons.css" />
  <link rel="stylesheet" href="css/sui/sui.css" />
  <style>
    /* ── Raid View ────────────────────────────────────────────────────────
       A read-only spectator. This document deliberately does NOT load the
       game bundle: it shares an origin with the game (both are served from
       tauri://localhost), so booting index.html here would share localStorage
       — which holds the mnemonic — resume proof-of-work whose task registry is
       keyed on struct id (duplicate tasks cancel each other), and double-answer
       broadcast signing requests. Tauri applies initialization_script per
       window, and raid-* windows are built without one. Nothing below can
       sign, mine, or write.

       The layout re-derives the game's own map geometry from MapConstants
       rather than reusing MapComponent, which cannot be reused here: its
       struct lookup is hardcoded to five keyPlayers buckets (one spectated
       planet per GameState) and it uses bare struct ids as DOM ids, so two
       windows on one planet would collide. Every id here is window-scoped. */

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--background, #0d0f15);
      color: var(--text-body, #c8d0e0);
      font-family: 'DirectiveZero', sans-serif;
      display: flex; flex-direction: column;
    }

    /* ── Header: who is fighting whom, and the shield ─────────────────── */
    #rv-head {
      flex: none; display: flex; align-items: center; gap: 18px;
      padding: 8px 14px; border-bottom: 1px solid var(--border-primary, #2a3040);
      background: var(--background-secondary, #141824);
      flex-wrap: wrap;
    }
    #rv-head .rv-title { font-family: 'ExtremeHazard', sans-serif; font-size: 13px;
      letter-spacing: .06em; color: var(--text-player-primary, #7fd6ff); }
    .rv-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rv-stat-v { font-size: 13px; white-space: nowrap; display: inline-flex;
      align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
    .rv-stat-l { font-family: 'ExtremeHazard', sans-serif; font-size: 8px;
      letter-spacing: .08em; color: var(--text-hint, #6b7488); text-transform: uppercase; }
    .rv-stat.warn .rv-stat-v { color: var(--text-warning, #ffb454); }
    .rv-stat.bad .rv-stat-v { color: var(--text-enemy-primary, #ff6b6b); }
    .rv-stat.ok .rv-stat-v { color: var(--text-player-primary, #7fd6ff); }
    #rv-head .rv-spacer { flex: 1 1 auto; }

    /* ── Map ──────────────────────────────────────────────────────────────
       Plain DOM + CSS background tiles, exactly the technique the game uses —
       no canvas, no WebGL, no sprite sheets. --tile-width/--tile-height come
       from sui.css (128px). */
    #rv-scroll { flex: 1 1 auto; overflow: auto; display: flex;
      align-items: flex-start; justify-content: center; padding: 16px; }
    #rv-map { position: relative; flex: none; }
    .rv-row { display: flex; }
    .rv-cell {
      position: relative; flex: none;
      width: var(--tile-width, 128px); height: var(--tile-height, 128px);
      background-repeat: no-repeat; background-position: center;
    }
    /* Transition rows: layers STACK inside one tile-height block (the game's
       .map-terrain-transition) — the previous ambit's edge-bottom under the
       next ambit's edge-top is what blends two bands together. */
    .rv-row.rv-transition { position: relative; height: var(--tile-height, 128px); }
    .rv-strip { position: absolute; top: 0; left: 0; display: flex; }
    .rv-tile { flex: none; width: var(--tile-width, 128px); height: var(--tile-height, 128px);
      background-repeat: no-repeat; background-position: center; }

    /* Slot markers: beacon on a buildable planetary slot, blocked art on an
       unusable cell — the game's MapTileMarkersComponent overlay. */
    .rv-marker { position: absolute; max-width: 100%; max-height: 100%;
      left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 50; }

    /* The mount a struct renders into. Attacker-side mounts are mirrored so
       raiders face the planet (.map-struct-layer-tile.mod-side-right). The
       HUD un-mirrors itself inside so text stays readable — the game keeps
       its HUD on a separate unflipped layer. */
    .rv-mount { position: absolute; inset: 0; }
    .rv-mount.rv-flip { transform: scaleX(-1); }
    .rv-mount.rv-flip .rv-hud { transform: scaleX(-1); }
    .rv-struct-wrap { position: absolute; inset: 0; }

    /* One struct: stacked absolutely-positioned PNG layers. The z-indices
       match the game's --struct-*-z-index so a weapon that renders over the
       hull in game renders over it here. */
    .rv-struct { position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; }
    .rv-struct img { position: absolute; max-width: 100%; max-height: 100%;
      z-index: 200; image-rendering: pixelated; }
    .rv-struct img.rv-top { z-index: 300; }
    .rv-struct img.rv-bottom { z-index: 100; }
    .rv-struct.rv-stealth { opacity: .5; }
    /* Lottie mounts here, above the still it is animating. */
    .rv-anim { position: absolute; inset: 0; z-index: 400; pointer-events: none; }

    /* HUD: segmented health (one cell per hit point) in a 48px dark box near
       the top of the tile — .map-struct-hud-status-bars + .struct-health-bar. */
    .rv-hud { position: absolute; inset: 0; z-index: 500; pointer-events: none; }
    .rv-hudbox { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 48px; padding: 2px; background: rgba(10, 12, 18, .85);
      border: 2px solid rgba(10, 12, 18, .85); }
    .rv-hp { display: flex; height: 4px; gap: 2px; }
    .rv-seg { display: block; flex: 1 1 100%;
      background: var(--struct-health-bar-damage, #612b3d); }
    .rv-seg.on { background: var(--struct-health-bar-health, #43d675); }
    .rv-tag { position: absolute; left: 4px; right: 4px; bottom: 4px;
      font-size: 8px; font-family: 'ExtremeHazard', sans-serif;
      letter-spacing: .06em; text-align: center;
      color: var(--text-hint, #6b7488); text-shadow: 0 1px 2px #000;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Ambit band label down the left edge. */
    .rv-band { position: absolute; left: -14px; top: 0; bottom: 0; width: 12px;
      display: flex; align-items: center; justify-content: center; }
    .rv-band span { font-family: 'ExtremeHazard', sans-serif; font-size: 8px;
      letter-spacing: .1em; color: var(--text-hint, #6b7488);
      writing-mode: vertical-rl; text-orientation: mixed; }

    /* ── PiP bubble — combat happening off-screen ─────────────────────────
       Transcribed from the game's .map-pip: a fixed 128px viewer at mid-
       height that slides in from the LEFT for a defender-side struct and the
       RIGHT for an attacker-side one, only while an attack-sequence animation
       plays for a struct whose tile is fully outside the scroll viewport.
       The side class anchors the off-screen rest position; sliding is done by
       toggling rv-vis while the side class stays put, so the left/right jump
       from swapping sides is never visible. */
    #rv-pip {
      position: fixed;
      top: calc(50vh - 64px);
      width: 128px; height: 128px;
      z-index: 800;
      display: block;
      visibility: hidden;
      transition: left 0.3s ease-in-out, right 0.3s ease-in-out;
    }
    #rv-pip.rv-side-left  { visibility: visible; left: -200px; right: auto; }
    #rv-pip.rv-side-right { visibility: visible; left: auto; right: -200px; }
    #rv-pip.rv-side-left.rv-vis  { left: 26px; }
    #rv-pip.rv-side-right.rv-vis { right: 26px; }

    .rv-pip-mask {
      position: absolute; top: 0; left: 0;
      display: flex; box-sizing: border-box;
      width: 118px; height: 118px;
      border-radius: 8px; margin: 5px;
      overflow: hidden; align-items: center; justify-content: center;
      background-repeat: no-repeat; background-position: center;
    }
    #rv-pip.rv-side-left  .rv-pip-mask { border: 1px solid var(--border-focus-friendly-dark, #2e7d5b); }
    #rv-pip.rv-side-right .rv-pip-mask { border: 1px solid var(--border-focus-enemy-dark, #7d2e3a); }

    .rv-pip-focus {
      position: relative; z-index: 10; display: flex;
      width: 128px; height: 128px;
      background-repeat: no-repeat; background-position: center;
    }
    #rv-pip.rv-side-left  .rv-pip-focus { background-image: url("img/focus/focus-friendly.png"); }
    #rv-pip.rv-side-right .rv-pip-focus { background-image: url("img/focus/focus-enemy.png"); }

    .rv-pip-caret-container {
      position: absolute; top: 0; left: 0;
      display: flex; width: 100%; height: 100%;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .rv-pip-caret { position: relative; display: inline-block; width: 12px; height: 36px; }
    #rv-pip.rv-side-left .rv-pip-caret {
      left: -71px;
      background: url("img/focus/focus-caret-friendly.png") no-repeat center/cover;
    }
    #rv-pip.rv-side-right .rv-pip-caret {
      left: 71px;
      background: url("img/focus/focus-caret-enemy.png") no-repeat center/cover;
      transform: scaleX(-1);
    }

    /* The struct (still + its own lottie mount) inside the mask; attacker-side
       content mirrored, exactly like its on-map tile. */
    .rv-pip-struct { position: absolute; top: 0; left: 0; width: 128px; height: 128px; }
    #rv-pip.rv-side-right .rv-pip-struct { transform: scaleX(-1); }
    .rv-pip-struct .rv-marker { z-index: 40; }

    /* ── End-of-raid banner ───────────────────────────────────────────── */
    #rv-banner {
      display: none; position: fixed; inset: 0; z-index: 900;
      align-items: center; justify-content: center; pointer-events: none;
    }
    #rv-banner svg { max-width: min(70vw, 640px); max-height: 50vh; }

    /* ── Status / empty states ────────────────────────────────────────── */
    #rv-note { flex: none; padding: 8px 14px; display: none; }
    #rv-note.on { display: block; }
    .rv-empty { display: flex; flex-direction: column; gap: 8px;
      align-items: center; justify-content: center; padding: 60px 20px;
      color: var(--text-hint, #6b7488); text-align: center; }
  </style>
</head>
<body>
  <div id="rv-head">
    <div class="rv-title" id="rv-where">—</div>
    <div class="rv-stat" id="rv-stat-status"><div class="rv-stat-v">—</div><div class="rv-stat-l">raid</div></div>
    <div class="rv-stat" id="rv-stat-shield"><div class="rv-stat-v">—</div><div class="rv-stat-l">shield</div></div>
    <div class="rv-stat" id="rv-stat-def"><div class="rv-stat-v">—</div><div class="rv-stat-l">defender</div></div>
    <div class="rv-stat" id="rv-stat-atk"><div class="rv-stat-v">—</div><div class="rv-stat-l">attacker</div></div>
    <div class="rv-spacer"></div>
    <div class="rv-stat" id="rv-stat-live"><div class="rv-stat-v">connecting</div><div class="rv-stat-l">feed</div></div>
  </div>

  <div id="rv-note"></div>

  <!-- The end-of-raid banner overlays the map; pointer-events:none so it
       never intercepts a scroll while it is playing out. -->
  <div id="rv-banner"></div>

  <!-- PiP bubble: mirrors the struct currently animating when its tile is
       fully off-screen. Structure matches the game's .map-pip markup. -->
  <div id="rv-pip">
    <div class="rv-pip-focus"></div>
    <div class="rv-pip-mask"><div class="rv-pip-struct" id="rv-pip-struct"></div></div>
    <div class="rv-pip-caret-container"><div class="rv-pip-caret"></div></div>
  </div>

  <div id="rv-scroll">
    <div id="rv-map">
      <div class="rv-empty" id="rv-boot">
        <i class="icon-in-progress"></i>
        <div>Waiting for the first snapshot…</div>
      </div>
    </div>
  </div>

  <script src="js/vendor/lottie-5.12.2.min.js"></script>
  <script src="raidview.js"></script>
</body>
</html>
