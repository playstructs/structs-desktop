<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Structs · Simulator</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/structicons.css">
  <link rel="stylesheet" href="css/sui/sui.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="chat-rows.css">
  <link rel="stylesheet" href="simulator.css">
</head>
<body id="sim" class="sui-theme-player sui-text-paragraph" data-screen="setup">
  <header id="sim-header">
    <div class="sim-title"><span class="sui-text-label sui-text-hint">Structs / Training</span><h1 class="sui-text-display">Battle simulator</h1></div>
    <nav id="crumb" class="sui-text-label" aria-label="Round">
      <span data-step="setup">Setup</span><i class="sui-icon-sm icon-chevron-right"></i><span data-step="battle">Battle</span><i class="sui-icon-sm icon-chevron-right"></i><span data-step="debrief">Debrief</span>
    </nav>
    <button id="start" type="button" class="sui-screen-btn sui-mod-primary sim-big"><span>Start battle</span><i class="sui-icon-md icon-chevron-right"></i></button>
  </header>

  <!-- ── Setup ─────────────────────────────────────────────────────────── -->
  <div id="setup-screen" class="sim-setup">
    <aside id="round" class="sim-card" aria-label="Round">
      <div class="sim-card-h"><span class="sui-text-label">Round</span></div>
      <div class="sim-card-b">
        <div id="addressed" class="sim-for hidden">
          <span id="addressed-pfp" class="sim-pfp sim-pfp-lg"></span>
          <span class="sim-for-who"><span id="addressed-name" class="sui-text-label"></span><span class="sui-text-hint">your DM</span></span>
          <button id="addressed-clear" type="button" class="sui-screen-btn sim-square" aria-label="Not for anyone" title="Not for anyone"><i class="sui-icon-sm icon-close"></i></button>
        </div>
        <div class="sim-field">
          <div class="sim-field-h"><span class="sui-text-label sui-text-hint">Encounter</span><i class="sui-icon-sm icon-enemy-tile sui-text-hint" title="Enemy structs" aria-label="Enemy structs"></i></div>
          <div id="encounters" class="sim-list" role="radiogroup" aria-label="Encounter"></div>
        </div>
        <div class="sim-field">
          <span class="sui-text-label sui-text-hint">Opponent</span>
          <div class="sim-cycler">
            <button id="ai-down" type="button" class="sui-screen-btn sim-square" aria-label="Easier opponent"><i class="sui-icon-sm icon-chevron-left"></i></button>
            <span id="ai-level" class="sui-text-label" aria-live="polite"></span>
            <button id="ai-up" type="button" class="sui-screen-btn sim-square" aria-label="Harder opponent"><i class="sui-icon-sm icon-chevron-right"></i></button>
          </div>
        </div>
        <div class="sim-field">
          <label for="seed" class="sui-text-label sui-text-hint">Seed</label>
          <div class="sim-row"><input type="text" id="seed" class="sim-input" value="spearpoint" maxlength="60" spellcheck="false" autocomplete="off">
            <button id="reseed" type="button" class="sui-screen-btn sim-square" aria-label="New seed" title="New seed"><i class="sui-icon-md icon-refresh-12"></i></button></div>
        </div>
        <div class="sim-field">
          <span class="sui-text-label sui-text-hint">Block time</span>
          <div id="block-time" class="sim-seg" role="radiogroup" aria-label="Block time"></div>
        </div>
        <div class="sim-field">
          <span class="sui-text-label sui-text-hint">Opening charge</span>
          <div id="charges" class="sim-charges"></div>
        </div>
        <div class="sim-field sim-field-rule">
          <span class="sui-text-label sui-text-hint">Share</span>
          <button id="send-to" type="button" class="sui-screen-btn sui-mod-primary sim-wide hidden"><i class="sui-icon-sm icon-outgoing"></i><span></span></button>
          <button id="live-to" type="button" class="sui-screen-btn sui-mod-secondary sim-wide hidden"><i class="sui-icon-sm icon-raid"></i><span></span></button>
          <button id="post-to" type="button" class="sui-screen-btn sim-wide"><i class="sui-icon-sm icon-outgoing"></i>Post to…</button>
          <div class="sim-pair">
            <button id="export" type="button" class="sui-screen-btn">Copy link</button>
            <button id="import" type="button" class="sui-screen-btn">Paste</button>
          </div>
        </div>
      </div>
    </aside>

    <aside id="challenge" class="sim-card sim-challenge hidden" aria-label="Challenge"></aside>

    <main id="fleets">
      <div id="defend-banner" class="hidden">
        <i class="sui-icon sui-icon-defending"></i><span id="defend-text" class="sui-text-label"></span>
        <button id="defend-cancel" type="button" class="sui-screen-btn">Cancel</button>
      </div>
      <div id="fleet-head">
        <div class="sim-side"><span class="sui-text-label sim-you">Your fleet</span><span id="count-you" class="sui-text-hint"></span></div>
        <div class="sim-head-tools">
          <span id="locked-chip" class="sim-chip sim-tag sui-text-label hidden"></span>
          <button id="unlock" type="button" class="sui-screen-btn sui-mod-secondary hidden"><i class="sui-icon-sm icon-edit"></i>Edit fleets</button>
          <button id="relock" type="button" class="sui-screen-btn sui-mod-secondary hidden">Back to the challenge</button>
          <button id="live-room" type="button" class="sui-screen-btn hidden" title="Anyone in the room may take it; anyone there may watch"><i class="sui-icon-sm icon-raid"></i>Play live</button>
          <button id="mirror" type="button" class="sui-screen-btn sui-mod-secondary" title="Copy your fleet to the computer"><i class="sui-icon-sm icon-chevron-right"></i>Mirror</button>
          <button id="swap" type="button" class="sui-screen-btn sui-mod-secondary" title="Trade fleets with the computer">Swap</button>
        </div>
        <div class="sim-side sim-side-cpu"><span class="sui-text-label sim-cpu">Computer</span><span id="count-cpu" class="sui-text-hint"></span></div>
      </div>
      <div id="arena" aria-label="Fleet setup"></div>
      <div id="checks" aria-live="polite"></div>
    </main>

    <aside id="inspector" class="sim-card" aria-label="Selected slot"></aside>
  </div>

  <!-- ── Battle ────────────────────────────────────────────────────────── -->
  <div id="battle-screen" class="hidden">
    <div id="battle-bar">
      <div id="chips" class="sim-chips"></div>
      <span id="standing" class="sui-text-label"></span>
      <span id="phase" class="sui-text-label"></span>
      <div class="sim-bar-tools">
        <button id="pause" type="button" class="sui-screen-btn"><i class="sui-icon-md icon-in-progress"></i><span>Pause</span></button>
        <button id="restart" type="button" class="sui-screen-btn sui-mod-secondary"><i class="sui-icon-md icon-refresh-12"></i>Rematch</button>
        <button id="end" type="button" class="sui-screen-btn sui-mod-destructive">End</button>
        <button id="to-debrief" type="button" class="sui-screen-btn sui-mod-primary hidden">Debrief<i class="sui-icon-md icon-chevron-right"></i></button>
      </div>
    </div>
    <div id="battle-main">
    <div id="board-wrap">
      <iframe id="board" title="Battle map" src="about:blank"></iframe>
      <div id="deploy" class="sim-overlay hidden" role="status">
        <div class="sim-card sim-deploy-card">
          <div class="sim-card-h sim-center"><span class="sui-text-label">Engagement</span></div>
          <div class="sim-matchup">
            <div class="sim-side"><span class="sui-text-label sim-you">Your fleet</span><span id="deploy-you"></span><div id="deploy-reach-you" class="sim-reach"></div></div>
            <span class="sui-text-display sui-text-hint sim-vs">vs</span>
            <div class="sim-side sim-side-cpu"><span class="sui-text-label sim-cpu">Computer</span><span id="deploy-cpu"></span><div id="deploy-reach-cpu" class="sim-reach"></div></div>
          </div>
          <div class="sim-countdown"><span class="sui-text-warning">Destroy the enemy command ship</span><span id="countdown" class="sui-text-display sim-huge"></span></div>
        </div>
      </div>
      <div id="paused" class="sim-overlay hidden" role="dialog" aria-label="Paused">
        <div class="sim-card sim-pause-card">
          <div class="sim-card-h"><span class="sui-text-label">Paused</span><span id="paused-clock" class="sui-text-label sui-text-hint"></span></div>
          <div class="sim-card-b">
            <button id="resume" type="button" class="sui-screen-btn sui-mod-primary sim-big sim-wide"><i class="sui-icon-md icon-chevron-right"></i>Resume</button>
            <div class="sim-field"><span class="sui-text-label sui-text-hint">Block time</span><div id="pause-block-time" class="sim-seg" role="radiogroup" aria-label="Block time"></div></div>
            <div class="sim-pair">
              <button id="pause-rematch" type="button" class="sui-screen-btn sui-mod-secondary">Rematch</button>
              <button id="pause-edit" type="button" class="sui-screen-btn sui-mod-secondary">Edit fleets</button>
            </div>
            <button id="pause-end" type="button" class="sui-screen-btn sui-mod-destructive sim-wide">End battle</button>
          </div>
        </div>
      </div>
    </div>
    <aside id="battle-thread" class="sim-rail hidden" aria-label="Challenge thread"></aside>
    </div>
  </div>

  <!-- ── Debrief ───────────────────────────────────────────────────────── -->
  <div id="debrief-screen" class="hidden">
    <div class="sim-debrief-wrap">
    <aside id="db-challenge" class="sim-card sim-challenge hidden" aria-label="Challenge"></aside>
    <div class="sim-debrief">
      <section class="sim-verdict">
        <div class="sim-verdict-text">
          <span id="verdict" class="sui-text-display sim-huge"></span>
          <span id="reason"></span>
          <span id="debrief-meta" class="sui-text-hint"></span>
        </div>
        <div class="sim-next">
          <button id="db-rematch" type="button" class="sui-screen-btn sui-mod-primary sim-big sim-wide"><i class="sui-icon-md icon-refresh-12"></i>Rematch</button>
          <div class="sim-pair">
            <button id="db-edit" type="button" class="sui-screen-btn sui-mod-secondary">Edit fleets</button>
            <button id="db-swap" type="button" class="sui-screen-btn sui-mod-secondary">Swap sides</button>
            <button id="db-harder" type="button" class="sui-screen-btn"></button>
            <button id="db-code" type="button" class="sui-screen-btn">Share</button>
          </div>
          <button id="db-new" type="button" class="sim-link sui-text-label">New encounter</button>
        </div>
      </section>
      <div id="db-post" class="sim-post hidden" role="status"></div>
      <div class="sim-debrief-cols">
        <section aria-label="Tallies">
          <div class="sim-tally sim-tally-h"><span></span><span class="sui-text-label sim-you">You</span><span class="sui-text-label sim-cpu">Computer</span></div>
          <div id="tallies"></div>
        </section>
        <section aria-label="Turning points">
          <h2 class="sui-text-label sui-text-hint">Turning points</h2>
          <div id="moments"></div>
          <button id="show-log" type="button" class="sui-screen-btn"><i class="sui-icon-md icon-combat-log"></i>Full battle log</button>
        </section>
      </div>
    </div>
    </div>
  </div>

  <div id="code-dialog" class="sim-overlay sim-fixed hidden" role="dialog" aria-labelledby="code-title">
    <div class="sim-card sim-code-card">
      <div class="sim-card-h"><span id="code-title" class="sui-text-label">Share</span>
        <button id="code-close" type="button" class="sui-screen-btn sim-square" aria-label="Close"><i class="sui-icon-sm icon-close"></i></button></div>
      <div class="sim-card-b">
        <textarea id="layout-code" class="sim-input" rows="6" spellcheck="false" aria-label="Battle link"></textarea>
        <button id="code-load" type="button" class="sui-screen-btn sui-mod-primary">Load layout</button>
      </div>
    </div>
  </div>

  <div id="post-dialog" class="sim-overlay sim-fixed hidden" role="dialog" aria-labelledby="post-title">
    <div class="sim-card sim-post-card">
      <div class="sim-card-h"><span id="post-title" class="sui-text-label">Share</span>
        <button id="post-close" type="button" class="sui-screen-btn sim-square" aria-label="Close"><i class="sui-icon-sm icon-close"></i></button></div>
      <div class="sim-card-b">
        <div id="post-what" class="sim-post-what"></div>
        <label class="sim-field"><span class="sui-text-label sui-text-hint">Post to</span>
          <input id="post-find" class="sim-input sim-input-wide" type="text" placeholder="Find a player or room" autocomplete="off" spellcheck="false"></label>
        <div id="post-rooms" class="sim-list sim-post-rooms" role="radiogroup" aria-label="Post to"></div>
        <div class="sim-post-go">
          <button id="post-send" type="button" class="sui-screen-btn sui-mod-primary"><i class="sui-icon-sm icon-outgoing"></i><span>Post</span></button>
          <button id="post-copy" type="button" class="sui-screen-btn"><i class="sui-icon-sm icon-copy"></i>Copy link</button>
        </div>
      </div>
    </div>
  </div>

  <div id="message" role="status" aria-live="polite"></div>
  <script src="pfp.js"></script><script src="chatrow.js"></script><script src="battle-art.js"></script><script src="simulator-types.js"></script><script src="simulator-chain.js"></script><script src="simulator-ai.js"></script><script src="simulator-host.js"></script><script src="simcode.js"></script><script src="simulator-live.js"></script><script src="simulator-rtc.js"></script><script src="simulator-social.js"></script><script src="simulator.js"></script>
</body>
</html>
