<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structs — Send Alpha</title>
  <!-- The same four the raid window loads, in the same order. main.css alone
       gets you the colours but not the FONT or any SUI component, so a window
       linking only that one renders as a plain web form beside a pixel-art
       game. -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/structicons.css">
  <link rel="stylesheet" href="css/sui/sui.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    /* SUI tokens only, and NO fallbacks.
     *
     * A `var(--x, #345)` fallback looks defensive and is the opposite: it makes
     * a token name that does not exist render as a colour this window invented,
     * which is how this window came to look like a web form beside a pixel-art
     * game. `--text-error`, `--input-background` and `--button-background` were
     * all names I had made up, silently resolving to my own hex. Without a
     * fallback a wrong token is visible immediately, which is what you want. */
    body {
      background: var(--page-background);
      color: var(--text-body);
      font-family: 'DirectiveZero', sans-serif;
      /* main.css centres body text for the game's own screens; every label and
         fact here is a left-hand column. */
      text-align: left;
    }
    /* The panel fills the window; SUI's own art draws every edge. */
    /* `min-height`, not `height`: this window is sized to its CONTENT (see
       `fitWindow` in transfer.js), so the layout must be free to grow past the
       viewport for the frame in which it is measured. Pinned to 100% it would
       report the window's own height back and never grow. */
    #tx-layout { min-height: 100%; display: flex; padding: var(--spacing-sm); }
    #tx-layout > .sui-panel { flex: 1 1 auto; min-width: 0; }
    #tx-body {
      display: flex; flex-direction: column; gap: var(--spacing-md);
      padding: var(--spacing-md);
    }

    /* Layout only. Every colour and every size comes from a token, and all
       typography comes from a `sui-text-*` class in the markup. */
    .tx-sub { color: var(--text-hint); overflow-wrap: anywhere; }
    .tx-facts { display: flex; flex-direction: column; gap: var(--spacing-xs); }
    .tx-fact { display: flex; gap: var(--spacing-sm); align-items: baseline; }
    .tx-fact-label { flex: 0 0 78px; color: var(--text-hint); }
    .tx-fact-value { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .tx-all { margin-left: var(--spacing-sm); color: var(--accent-primary); }

    /* Parties, asset and unit. main.css centres text on everything that goes
       full width, so these say left explicitly — it has bitten this window
       once already. */
    .tx-parties { display: flex; flex-direction: column; gap: var(--spacing-sm);
                  text-align: left; }
    .tx-row { display: flex; align-items: center; gap: var(--spacing-md);
              text-align: left; }
    .tx-row select { flex: 1 1 auto; min-width: 0; }
    .tx-amount-row { display: flex; align-items: flex-end; gap: var(--spacing-md);
                     text-align: left; }
    .tx-amount-row label.sui-input-text { flex: 1 1 auto; }
    .tx-amount-row select { flex: 0 0 auto; }
    /* The party row's own line, under the name. */
    .tx-party-addr { color: var(--text-hint); overflow-wrap: anywhere; }
    .tx-all:hover { color: var(--accent-primary-active); }

    /* SUI fields carry a min-width wider than this window. */
    label.sui-input-text { min-width: 0; }

    /* No scroller: a payment screen is short and every line of it matters, so
       the WINDOW grows instead of hiding the end of the message. */
    #tx-out {
      flex: 0 0 auto;
      display: flex; flex-direction: column; gap: var(--spacing-xs);
    }
    /* The same left-rule the Comms window uses to mark a line as commentary
       rather than content. */
    .tx-msg {
      padding: var(--spacing-xs) var(--spacing-sm);
      border-left: 2px solid var(--border-subtle);
    }
    /* "enemy" is the game's own semantic for danger — main.css has no
       `--text-error`, and chat.html styles its failures this way too. */
    .tx-msg.tx-error {
      border-left-color: var(--text-enemy-primary);
      color: var(--text-enemy-primary);
    }
    .tx-msg.tx-warn {
      border-left-color: var(--text-warning);
      color: var(--text-warning);
    }
    .tx-actions { display: flex; gap: var(--spacing-sm); justify-content: flex-end; }
    .sui-screen-btn.tx-disabled { opacity: .4; pointer-events: none; }
  </style>
</head>
<body>

<!-- A Structs SCREEN, not a page with Structs colours on it.
     The frame is SUI's own: a `.sui-panel` with its fill backgrounds and edges,
     one `.sui-panel-chunk` holding a `.sui-screen` header and a
     `.sui-page-body-screen` body. Copied in structure from chat.html, which is
     itself the game's menu-page shell — the panel art does all the drawing, and
     nothing here paints a border of its own. -->
<div id="tx-layout">
  <div class="sui-panel sui-theme-player">
    <div class="sui-panel-top-fill-background"></div>
    <div class="sui-panel-bottom-fill-background"></div>
    <div class="sui-panel-edge-left"></div>

    <div class="sui-panel-chunk sui-mod-grow sui-mod-shrink">

      <div class="sui-screen sui-screen-full-width">
        <div class="sui-screen-nav">
          <div class="sui-screen-nav-items">
            <span class="sui-screen-nav-item sui-mod-active" id="tx-title">SEND ALPHA</span>
          </div>
          <a id="tx-close" class="sui-screen-nav-close" href="javascript: void(0)" title="Close">
            <i class="sui-icon-sm icon-close"></i>
          </a>
        </div>
      </div>

      <div class="height-100 sui-screen sui-screen-full-width sui-screen-shrink">
        <div class="height-100 sui-page-body-screen">
          <div id="tx-body">

            <div class="tx-sub sui-text-tiny" id="tx-who">…</div>

            <!-- Who is paying whom, as PEOPLE. The game draws a player as a
                 portrait with a name and an id; a payment screen that showed
                 the word "primary" twice was naming neither party. Same
                 `sui-result-row` idiom the roster uses. -->
            <div class="tx-parties" id="tx-parties"></div>

            <!-- Which asset. Present whenever more than one is holdable, so a
                 player with only Alpha never sees a choice they do not have. -->
            <div class="tx-row" id="tx-asset-row" hidden>
              <label class="sui-text-label" for="tx-asset">Asset</label>
              <select id="tx-asset" class="sui-text-tiny"></select>
            </div>

            <div class="tx-facts" id="tx-facts"></div>

            <!-- Amount and its unit. The unit is a CONTROL rather than
                 something to be typed, so "9.4Kg" and "9400g" are one click
                 apart instead of a spelling the player has to know. Typing a
                 suffix still works. -->
            <div class="tx-amount-row">
              <!-- SUI's own field: `.sui-input-text` is the LABEL wrapper, and
                   the input inside it is styled by descendant rules. -->
              <label class="sui-input-text" for="tx-amount">
                <span id="tx-amount-label">Amount</span>
                <input id="tx-amount" type="text" inputmode="decimal"
                       placeholder="0" autocomplete="off">
              </label>
              <select id="tx-unit" class="sui-text-tiny" title="Unit"></select>
            </div>

            <div id="tx-out"></div>

            <div class="tx-actions">
              <a href="javascript:void(0)" id="tx-cancel" class="sui-screen-btn sui-mod-secondary">
                <i class="icon-close"></i><span> Cancel</span></a>
              <a href="javascript:void(0)" id="tx-send" class="sui-screen-btn sui-mod-primary tx-disabled">
                <i class="icon-send-alpha"></i><span id="tx-send-label"> Send</span></a>
            </div>

          </div>
        </div>
      </div>

    </div>
    <div class="sui-panel-edge-right"></div>
  </div>
</div>

  <script src="units.js"></script>
  <!-- Portrait composer first: transfer.js draws both parties as player cards. -->
  <script src="pfp.js"></script>
  <script src="transfer.js"></script>
</body>
</html>
