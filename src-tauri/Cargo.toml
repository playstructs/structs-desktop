[package]
name = "structs-app"
version = "0.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
# Map rendering: decode captured PNG frames + encode animated GIF
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
anyhow = "1"
# Stochastic policy: the automation samples from weighted move distributions
# instead of always taking the argmax (see mcp/variance.rs). Already present in
# Cargo.lock transitively via wgpu/uuid/reqwest, so this adds no new download.
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
# Update awareness: compare app version to latest GitHub release, open releases page
semver = "1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Hasher: multi-threaded SHA256 proof-of-work
sha2 = "0.10"
rayon = "1.10"
num_cpus = "1.16"
dashmap = "6"
hex = "0.4"
# GPU compute for SHA256 hashing
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# MCP server
rmcp = { version = "0.15", features = ["server", "macros", "transport-streamable-http-server"] }
# Operational telemetry: persistent event/liveness/tx/pow store (state.db)
rusqlite = { version = "0.32", features = ["bundled"] }
axum08 = { package = "axum", version = "0.8" }
tokio-stream = { version = "0.1", features = ["sync"] }
schemars = "1"
uuid = { version = "1", features = ["v4"] }
tower = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-window-state = "2.4.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cosmrs = { version = "0.22", features = ["bip32"] }
prost-reflect = { version = "0.16", features = ["serde"] }
bip39 = "2"
keyring = "4"
zeroize = "1"
prost = "0.14"
# Native notifications (macOS uses UNUserNotificationCenter via objc2)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[features]
custom-protocol = ["tauri/custom-protocol"]
